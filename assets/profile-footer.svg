<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="100%" height="86">
  <defs>
    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060b18" />
      <stop offset="50%" stop-color="#0a142c" />
      <stop offset="100%" stop-color="#060b18" />
    </linearGradient>
    <linearGradient id="ft-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.25" />
    </linearGradient>
    <style>
