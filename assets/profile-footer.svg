  </defs>

  <rect x="1" y="1" width="898" height="66" rx="12" fill="url(#ft-bg)" stroke="url(#ft-stroke)" stroke-width="1.2" />

  <text x="450" y="30" text-anchor="middle" class="ft-mono">HAZIM BASHIR • SOFTWARE CREATOR</text>
  <text x="450" y="50" text-anchor="middle" class="ft-text">Building useful digital experiences  •  Engineered with care for accessible technology</text>
