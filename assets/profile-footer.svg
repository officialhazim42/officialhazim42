<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="100%" height="86">
  <defs>
    <!-- Dark Navy Glassmorphism Gradient -->
    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081329" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#0d1f42" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#071126" stop-opacity="0.98" />
    </linearGradient>

    <!-- Subtle Accent Stroke Gradient -->
    <linearGradient id="ft-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#0ea5e9" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Center Radial Glow -->
    <radialGradient id="ft-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Divider Line Gradient -->
    <linearGradient id="ft-div" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0" />
    </linearGradient>

    <style>
      @keyframes ftEntrance {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes dotPulse {
        0%, 100% { r: 3; opacity: 0.85; filter: drop-shadow(0 0 2px #38bdf8); }
        50% { r: 4; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      .ft-root {
        animation: ftEntrance 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .jewel-dot {
        animation: dotPulse 2.6s ease-in-out infinite;
      }
      .ft-brand {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11.5px;
        fill: #38bdf8;
        letter-spacing: 2.2px;
        font-weight: 700;
      }
      .ft-descriptor {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 500;
        fill: #cbd5e1;
        letter-spacing: 0.4px;
      }
      .ft-bullet {
        fill: #38bdf8;
        font-weight: 700;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .ft-root, .jewel-dot {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <g class="ft-root">
    <!-- Frame Container -->
    <rect x="1" y="1" width="898" height="84" rx="10" fill="url(#ft-bg)" stroke="url(#ft-stroke)" stroke-width="1.1" />
    <rect x="1" y="1" width="898" height="84" rx="10" fill="url(#ft-glow)" />

    <!-- Center Top Decorative Pulsing Jewel Dot -->
    <circle cx="450" cy="1" r="3" fill="#38bdf8" class="jewel-dot" />

    <!-- Line 1: Verified Developer Identity & Brand -->
    <text x="450" y="34" text-anchor="middle" class="ft-brand">HAZIM BASHIR FAQEER &#8226; @OFFICIALHAZIM42 &#8226; SOFTWARE CREATOR</text>

    <!-- Restrained Center Divider -->
    <line x1="280" y1="48" x2="620" y2="48" stroke="url(#ft-div)" stroke-width="1" />

    <!-- Line 2: Focus & Regional Base -->
    <text x="450" y="68" text-anchor="middle" class="ft-descriptor">
      <tspan>Client-Side &amp; Web Engineering</tspan>
      <tspan class="ft-bullet"> &#8226; </tspan>
      <tspan>Ganderbal, Jammu &amp; Kashmir, India</tspan>
      <tspan class="ft-bullet"> &#8226; </tspan>
      <tspan>Open Source</tspan>
    </text>
  </g>
</svg>