<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 68" width="100%" height="68">
  <defs>
    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060b18" />
      <stop offset="50%" stop-color="#0a142c" />
      <stop offset="100%" stop-color="#060b18" />
    </linearGradient>
    <linearGradient id="ft-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.2" />
    </linearGradient>
    <style>
      .ft-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        fill: #38bdf8;
        letter-spacing: 2px;
        font-weight: 600;
      }
      .ft-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        fill: #94a3b8;
        letter-spacing: 0.3px;
      }
