<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 58" width="100%" height="58">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sec-bg-04" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0c1833" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.96" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="sec-stroke-04" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Indicator Accent Gradient -->
    <linearGradient id="ind-grad-04" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Underline Accent Gradient -->
    <linearGradient id="acc-grad-04" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Reveal Clip Path -->
    <clipPath id="clip-04">
      <rect x="120" y="8" width="500" height="42" class="clip-rect" />
    </clipPath>

    <style>
      .mono-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .sec-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 16.5px;
        font-weight: 800;
        letter-spacing: 1.2px;
        fill: #ffffff;
      }
      .slash-accent {
        fill: #38bdf8;
        font-weight: 900;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #94a3b8;
      }

      /* Dynamic Keyframe Animations */
      .clip-rect {
        animation: textReveal-04 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .text-cursor {
        animation: cursorTrack-04 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .accent-line {
        stroke-dasharray: 150;
        stroke-dashoffset: 0;
        animation: drawAccent-04 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .left-indicator {
        animation: pulseIndicator 4s ease-in-out infinite;
      }
      .divider-filament {
        animation: pulseFilament 4s ease-in-out infinite;
      }
      .status-dot {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .diamond-marker {
        transform-origin: 0px 0px;
        animation: diamondScaleSeq 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform, filter, opacity;
      }
      .diamond-trail {
        stroke-dasharray: 47;
        stroke-dashoffset: 44;
        opacity: 0.4;
        animation: diamondTrailSeq 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: stroke-dashoffset, opacity, filter;
      }
      .diamond-end-dot {
        opacity: 0.45;
        animation: diamondDotSeq 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: opacity, fill, filter;
      }

      @keyframes textReveal-04 {
        0% { width: 0; }
        15% { width: 217px; }
        88% { width: 217px; opacity: 1; }
        96% { width: 217px; opacity: 0.8; }
        100% { width: 0; opacity: 0; }
      }

      @keyframes cursorTrack-04 {
        0% { transform: translateX(0); opacity: 1; }
        15% { transform: translateX(209px); opacity: 1; }
        19%, 27%, 35% { opacity: 0; }
        23%, 31% { opacity: 1; }
        39%, 88% { opacity: 0; transform: translateX(209px); }
        96% { opacity: 0.5; transform: translateX(209px); }
        100% { opacity: 0; transform: translateX(0); }
      }

      @keyframes drawAccent-04 {
        0%, 5% { stroke-dashoffset: 150; opacity: 0; }
        18% { stroke-dashoffset: 0; opacity: 1; }
        88% { stroke-dashoffset: 0; opacity: 0.9; }
        96% { opacity: 0; stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 150; opacity: 0; }
      }

      @keyframes pulseIndicator {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
      }

      @keyframes pulseFilament {
        0%, 100% { stroke: #1e3a5f; }
        50% { stroke: #38bdf8; }
      }

      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
      }

      /* Phase 1 and 2: Diamond scale-up from center (0s - 0.5s), hold (0.5s - 1.1s), scale-down (1.1s - 1.6s) */
      @keyframes diamondScaleSeq {
        0% { transform: scale(0.65); opacity: 0.75; filter: drop-shadow(0 0 1px #38bdf8); }
        16.7% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
        26.7%, 36.7% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
        53.3% { transform: scale(0.65); opacity: 0.75; filter: drop-shadow(0 0 1px #38bdf8); }
        100% { transform: scale(0.65); opacity: 0.75; filter: drop-shadow(0 0 1px #38bdf8); }
      }

      /* Line extend (0s - 0.5s), hold extended at endpoint dot (0.5s - 1.1s), retract (1.1s - 1.6s) */
      @keyframes diamondTrailSeq {
        0% { stroke-dashoffset: 44; opacity: 0.4; filter: none; }
        16.7% { stroke-dashoffset: 0; opacity: 1; filter: drop-shadow(0 0 2.5px #38bdf8); }
        26.7%, 36.7% { stroke-dashoffset: 0; opacity: 1; filter: drop-shadow(0 0 2.5px #38bdf8); }
        53.3% { stroke-dashoffset: 44; opacity: 0.4; filter: none; }
        100% { stroke-dashoffset: 44; opacity: 0.4; filter: none; }
      }

      /* Endpoint dot: pulses and brightens when line reaches endpoint (0.5s - 0.8s), holds, fades on retract */
      @keyframes diamondDotSeq {
        0%, 16.7% { opacity: 0.45; fill: #0284c7; filter: none; }
        26.7%, 36.7% { opacity: 1; fill: #38bdf8; filter: drop-shadow(0 0 4px #38bdf8); }
        53.3%, 100% { opacity: 0.45; fill: #0284c7; filter: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .text-cursor, .clip-rect {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Glass Card Background -->
  <rect x="1" y="1" width="898" height="56" rx="10" fill="url(#sec-bg-04)" stroke="url(#sec-stroke-04)" stroke-width="1.2" />

  <!-- Left Animated Glowing Indicator -->
  <rect class="left-indicator" x="1" y="10" width="4" height="38" rx="2" fill="url(#ind-grad-04)" />

  <!-- Section Number Badge Pill -->
  <g transform="translate(22, 15)">
    <rect width="64" height="28" rx="6" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <text x="32" y="14" text-anchor="middle" dominant-baseline="central" class="mono-badge">◈ 04</text>
  </g>

  <!-- Vertical Divider Filament -->
  <line x1="102" y1="14" x2="102" y2="44" stroke="#1e3a5f" stroke-width="1" class="divider-filament" />
  <circle cx="102" cy="18" r="1.8" fill="#38bdf8" />
  <circle cx="102" cy="40" r="1.8" fill="#0284c7" />

  <!-- Main Section Title with Animated Progressive Reveal -->
  <g clip-path="url(#clip-04)">
    <text class="sec-title" x="120" y="36">FEATURED PROJECTS</text>
  </g>

  <!-- Traveling Typing Cursor -->
  <rect class="text-cursor" x="120" y="20" width="2" height="20" rx="1" fill="#38bdf8" />

  <!-- Subtle Animated Underline Accent -->
  <line class="accent-line" x1="120" y1="46" x2="270" y2="46" stroke="url(#acc-grad-04)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Section-Specific Right Visual Marker and Telemetry -->
    <!-- Right Motif: Showcase Diamond & Open-Source Tag -->
  <g transform="translate(660, 17)">
    <!-- Cyan Diamond Icon: Centered at (15, 12), scales up/down smoothly from its center -->
    <g transform="translate(15, 12)">
      <polygon points="0,-8 4,0 0,8 -4,0" fill="#38bdf8" class="diamond-marker" transform="scale(0.65)">
        <animateTransform
          attributeName="transform"
          type="scale"
          values="0.65; 1.15; 1.15; 1.15; 0.65; 0.65"
          keyTimes="0; 0.167; 0.267; 0.367; 0.533; 1"
          dur="3s"
          repeatCount="indefinite" />
      </polygon>
    </g>

    <!-- Guide Track Line (Dark Blue) -->
    <line x1="28" y1="12" x2="75" y2="12" stroke="#1e3a5f" stroke-width="1" />

    <!-- Animated Connecting Line: Extends from diamond (x1=28) to endpoint dot (x2=75), then retracts -->
    <line class="diamond-trail" x1="28" y1="12" x2="75" y2="12" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="47" stroke-dashoffset="44" opacity="0.4">
      <animate attributeName="stroke-dashoffset" dur="3s" repeatCount="indefinite"
               values="44; 0; 0; 0; 44; 44"
               keyTimes="0; 0.167; 0.267; 0.367; 0.533; 1" />
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
               values="0.4; 1; 1; 1; 0.4; 0.4"
               keyTimes="0; 0.167; 0.267; 0.367; 0.533; 1" />
    </line>

    <!-- Endpoint Dot: Brightens / pulses when the line reaches it, then gently fades on retract -->
    <circle cx="75" cy="12" r="2.5" fill="#0284c7" class="diamond-end-dot" opacity="0.45">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite"
               values="0.45; 0.45; 1; 1; 0.45; 0.45"
               keyTimes="0; 0.167; 0.267; 0.367; 0.533; 1" />
      <animate attributeName="fill" dur="3s" repeatCount="indefinite"
               values="#0284c7; #0284c7; #38bdf8; #38bdf8; #0284c7; #0284c7"
               keyTimes="0; 0.167; 0.267; 0.367; 0.533; 1" />
    </circle>

    <rect x="85" y="0" width="140" height="24" rx="5" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="98" cy="12" r="3" fill="#38bdf8" />
    <text x="109" y="12" dominant-baseline="central" class="mono-meta">SHOWCASE REPOS</text>
  </g>
</svg>