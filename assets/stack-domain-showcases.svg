<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 84" width="100%" height="84">
  <defs>
    <linearGradient id="pnl-bg-domains" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.98" />
      <stop offset="60%" stop-color="#0c1833" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="pnl-stroke-domains" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="card-inner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1730" />
      <stop offset="100%" stop-color="#102344" />
    </linearGradient>
    <radialGradient id="glow-domains" cx="95%" cy="10%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a1329" stop-opacity="0" />
    </radialGradient>
    <style>
      .tag { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 400; fill: #94a3b8; }
      .c-name { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      .c-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 500; fill: #94a3b8; }
      .badge-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 7.5px; font-weight: 800; letter-spacing: 0.5px; text-anchor: middle; }
    </style>
  </defs>
  <!-- Panel Base -->
  <rect x="1" y="1" width="898" height="82" rx="12" fill="url(#pnl-bg-domains)" stroke="url(#pnl-stroke-domains)" stroke-width="1.2" />
  <rect x="1" y="1" width="898" height="82" rx="12" fill="url(#glow-domains)" />
  
  <!-- Left Accent Bar -->
  <rect x="1" y="12" width="4" height="42" rx="2" fill="#38bdf8" />

  <!-- Top Header Block -->
  <g transform="translate(24, 25)">
    <text class="tag">◈ 03.5 / ARCHITECTURE &amp; INTEGRATION</text>
    <text y="20" class="title">ARCHITECTURAL DOMAIN SHOWCASES</text>
    <text y="38" class="sub">Specialized implementation architectures across client compute, document engineering, cloud, and tooling</text>
  </g>

  <!-- Right Decorative Traces & Dots -->
  <g transform="translate(680, 24)">
    <line x1="0" y1="12" x2="160" y2="12" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="170" cy="12" r="3.5" fill="#38bdf8" />
    <circle cx="185" cy="12" r="2" fill="#06b6d4" />
    <circle cx="198" cy="12" r="1.5" fill="#3b82f6" />
  </g>

  <!-- Bottom Indicator Line with Down Arrow -->
  <g transform="translate(450, 75)">
    <line x1="-380" y1="0" x2="-20" y2="0" stroke="#1E3A5F" stroke-width="1" />
    <line x1="20" y1="0" x2="410" y2="0" stroke="#1E3A5F" stroke-width="1" />
    <path d="M -8 -4 L 0 4 L 8 -4" stroke="#38bdf8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>