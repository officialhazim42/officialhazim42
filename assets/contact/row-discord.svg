<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="48">
  <defs>
    <!-- Base Row Glass Gradient -->
    <linearGradient id="row-bg-discord" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060b18" stop-opacity="0.96" />
      <stop offset="26%" stop-color="#101336" stop-opacity="0.82" />
      <stop offset="68%" stop-color="#0c0e29" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#161a47" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="row-stroke-discord" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(88, 101, 242, 0.35)" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="rgba(88, 101, 242, 0.35)" />
    </linearGradient>

    <!-- Platform Cell Gradient -->
    <linearGradient id="p-bg-discord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101336" />
      <stop offset="100%" stop-color="#171b4a" />
    </linearGradient>

    <!-- Identity Cell Gradient -->
    <linearGradient id="id-bg-discord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e29" />
      <stop offset="100%" stop-color="#121538" />
    </linearGradient>

    <!-- Action Button Gradient -->
    <linearGradient id="btn-bg-discord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161a47" />
      <stop offset="100%" stop-color="#212769" />
    </linearGradient>

    <style>
      .p-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
      .p-handle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
      .p-btn { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #a5b4fc; letter-spacing: 0.8px; }
    </style>
  </defs>

  <!-- Base Row Container -->
  <rect x="1" y="1" width="898" height="46" rx="8" fill="url(#row-bg-discord)" stroke="url(#row-stroke-discord)" stroke-width="1.1" />

  <!-- Left Accent Notch -->
  <rect x="1" y="12" width="3" height="24" rx="1.5" fill="#5865f2" />

  <!-- 1. Channel / Platform Cell -->
  <g transform="translate(8, 5)">
    <rect x="0" y="0" width="222" height="38" rx="6" fill="url(#p-bg-discord)" stroke="rgba(88, 101, 242, 0.55)" stroke-width="1" />
    <g transform="translate(14, 9)">
      <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" fill="#5865F2"/>
    </g>
    <text x="44" y="24" class="p-name">Discord</text>
  </g>

  <!-- 2. Verified Identity Cell -->
  <g transform="translate(236, 5)">
    <rect x="0" y="0" width="456" height="38" rx="6" fill="url(#id-bg-discord)" stroke="rgba(88, 101, 242, 0.55)" stroke-width="1" />
    <!-- Identity Symbol / Prompt -->
    <path d="M14 19l4-4-4-4" stroke="#5865f2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
    <text x="28" y="24" class="p-handle">officialhazim42</text>
  </g>

  <!-- 3. Direct Connection Action Button Cell -->
  <g transform="translate(698, 5)">
    <rect x="0" y="0" width="194" height="38" rx="6" fill="url(#btn-bg-discord)" stroke="rgba(88, 101, 242, 0.55)" stroke-width="1.1" />
    <text x="18" y="24" class="p-btn">CONNECT</text>
    <path d="M174 15l4 4-4 4m4-4h-8" stroke="#a5b4fc" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  </g>
</svg>