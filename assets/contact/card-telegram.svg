<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="60" style="overflow: visible;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg-telegram" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081329" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#0d1f42" stop-opacity="0.94" />
      <stop offset="75%" stop-color="#08152e" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#071126" stop-opacity="0.98" />
    </linearGradient>

    <!-- Card Stroke Gradient -->
    <linearGradient id="card-stroke-telegram" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(38, 165, 228, 0.55)" />
      <stop offset="30%" stop-color="rgba(56, 189, 248, 0.35)" />
      <stop offset="70%" stop-color="rgba(14, 165, 233, 0.3)" />
      <stop offset="100%" stop-color="rgba(38, 165, 228, 0.55)" />
    </linearGradient>

    <!-- Logo Glow -->
    <radialGradient id="logo-glow-telegram" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#26a5e4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#26a5e4" stop-opacity="0" />
    </radialGradient>

    <!-- STAGE A: Platform Name Clip -->
    <clipPath id="clip-pname-telegram">
      <rect x="32" y="6" width="0" height="34">
        <animate
          attributeName="width"
          dur="8s"
          begin="2.8s"
          repeatCount="indefinite"
          keyTimes="0; 0.025; 0.125; 0.25; 0.312; 0.35; 1"
          values="0; 0; 78; 78; 0; 0; 0"
          calcMode="linear"
        />
      </rect>
    </clipPath>

    <!-- STAGE B: Verified Handle Clip (3-4s reading pause) -->
    <clipPath id="clip-handle-telegram">
      <rect x="32" y="6" width="0" height="34">
        <animate
          attributeName="width"
          dur="8s"
          begin="2.8s"
          repeatCount="indefinite"
          keyTimes="0; 0.35; 0.487; 0.887; 0.975; 1"
          values="0; 0; 148; 148; 0; 0"
          calcMode="linear"
        />
      </rect>
    </clipPath>

    <style>
      svg { overflow: visible; }
      .card-box {
        transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), filter 0.24s ease;
      }
      .card-box:hover, svg:hover .card-box {
        filter: drop-shadow(0 6px 20px rgba(56, 189, 248, 0.28));
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 14.5px;
        font-weight: 600;
      }
      .text-pname {
        fill: #38bdf8;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      .text-handle {
        fill: #26a5e4;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .prompt {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        font-weight: 800;
        fill: #38bdf8;
      }
      .cursor {
        fill: #38bdf8;
      }

      /* Right Side Action Button with Unified Interactive System */
      .btn-action-group {
        cursor: pointer;
        transform-origin: 790px 30px;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
      }
      .btn-action-group .btn-rect {
        transition: stroke 0.2s ease, stroke-width 0.2s ease, fill 0.2s ease;
      }
      .btn-action-group .btn-arrow-icon {
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #f8fafc;
        letter-spacing: 1px;
      }
      
      /* Hover State: Smooth lift, subtle scale (1.028), platform-colored glow, arrow slide */
      .card-box:hover .btn-action-group, svg:hover .btn-action-group {
        transform: translateY(-1.5px) scale(1.028);
        filter: drop-shadow(0 4px 14px rgba(38, 165, 228, 0.4));
      }
      .card-box:hover .btn-rect, svg:hover .btn-rect {
        stroke: #26a5e4;
        stroke-width: 1.4;
        fill: #132b57;
      }
      .card-box:hover .btn-arrow-icon, svg:hover .btn-arrow-icon {
        transform: translateX(4px);
      }
      .card-box:active .btn-action-group, svg:active .btn-action-group {
        transform: translateY(0.5px) scale(0.98);
      }
      .btn-action-group:focus {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *, .card-box, .cursor, rect, path, text, .btn-action-group, .btn-arrow-icon {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </defs>

  <g class="card-box">
    <!-- Card Frame -->
    <rect x="1" y="2" width="898" height="56" rx="10" fill="url(#card-bg-telegram)" stroke="url(#card-stroke-telegram)" stroke-width="1.1" />

    <!-- Left Platform Brand Accent Notch -->
    <rect x="1" y="14" width="3.5" height="32" rx="1.75" fill="#26a5e4" />

    <!-- PHASE 1: Platform Logo Icon (with subtle fade/scale entrance) -->
    <g transform="translate(14, 9)">
      <circle cx="21" cy="21" r="23" fill="url(#logo-glow-telegram)" />
      <rect x="0" y="0" width="42" height="42" rx="8" fill="#091122" stroke="rgba(38, 165, 228, 0.55)" stroke-width="1" />
      <g transform="translate(9, 9)">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z" fill="#26A5E4"/>
      </g>
    </g>

    <!-- Dynamic Terminal Display Container -->
    <g transform="translate(68, 9)">
      <rect x="0" y="0" width="616" height="42" rx="7" fill="#050c1c" stroke="#16284a" stroke-width="1" />
      
      <!-- Terminal Prompt Symbol -->
      <text x="14" y="26" class="prompt">&gt;</text>

      <!-- STAGE A: Platform Name Text -->
      <g clip-path="url(#clip-pname-telegram)">
        <text x="32" y="26" class="mono-text text-pname">Telegram</text>
      </g>

      <!-- STAGE B: Verified Handle Text (3-4s reading hold) -->
      <g clip-path="url(#clip-handle-telegram)">
        <text x="32" y="26" class="mono-text text-handle">@officialhazim42</text>
      </g>

      <!-- Dynamic Blinking Keystroke Cursor that tracks typing and backspacing -->
      <rect y="12" width="2.2" height="18" rx="1" class="cursor">
        <animate
          attributeName="x"
          dur="8s"
          begin="2.8s"
          repeatCount="indefinite"
          keyTimes="0; 0.025; 0.125; 0.25; 0.312; 0.35; 0.487; 0.887; 0.975; 1"
          values="32; 32; 110; 110; 32; 32; 180; 180; 32; 32"
          calcMode="linear"
        />
        <animate
          attributeName="opacity"
          dur="0.8s"
          repeatCount="indefinite"
          values="1; 1; 0; 0"
          keyTimes="0; 0.5; 0.51; 1"
        />
      </rect>
    </g>

    <!-- Right Side Attractive Action Button -->
    <g transform="translate(696, 9)" class="btn-action-group" role="button" tabindex="0">
      <rect x="0" y="0" width="188" height="42" rx="8" class="btn-rect" fill="#0d1f42" stroke="rgba(38, 165, 228, 0.55)" stroke-width="1.1" />
      <text x="38" y="26" class="btn-label">CONNECT</text>
      <g transform="translate(150, 15)" class="btn-arrow-icon">
        <path d="M0 6h14m-5-5l5 5-5 5" stroke="#26a5e4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <animateTransform
            attributeName="transform"
            type="translate"
            dur="2.4s"
            repeatCount="indefinite"
            values="0,0; 3,0; 0,0"
            keyTimes="0; 0.5; 1"
          />
        </path>
      </g>
    </g>
  </g>
</svg>