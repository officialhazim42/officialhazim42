<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="48">
  <defs>
    <!-- Base Row Glass Gradient -->
    <linearGradient id="row-bg-linkedin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060b18" stop-opacity="0.96" />
      <stop offset="26%" stop-color="#061a33" stop-opacity="0.82" />
      <stop offset="68%" stop-color="#051426" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#082447" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="row-stroke-linkedin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(10, 102, 194, 0.4)" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="rgba(10, 102, 194, 0.4)" />
    </linearGradient>

    <!-- Platform Cell Gradient -->
    <linearGradient id="p-bg-linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a33" />
      <stop offset="100%" stop-color="#09284d" />
    </linearGradient>

    <!-- Identity Cell Gradient -->
    <linearGradient id="id-bg-linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051426" />
      <stop offset="100%" stop-color="#08203d" />
    </linearGradient>

    <!-- Action Button Gradient -->
    <linearGradient id="btn-bg-linkedin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082447" />
      <stop offset="100%" stop-color="#0c3669" />
    </linearGradient>

    <style>
      .p-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
      .p-handle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
      .p-btn { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.8px; }
    </style>
  </defs>

  <!-- Base Row Container -->
  <rect x="1" y="1" width="898" height="46" rx="8" fill="url(#row-bg-linkedin)" stroke="url(#row-stroke-linkedin)" stroke-width="1.1" />

  <!-- Left Accent Notch -->
  <rect x="1" y="12" width="3" height="24" rx="1.5" fill="#0a66c2" />

  <!-- 1. Channel / Platform Cell -->
  <g transform="translate(8, 5)">
    <rect x="0" y="0" width="222" height="38" rx="6" fill="url(#p-bg-linkedin)" stroke="rgba(10, 102, 194, 0.55)" stroke-width="1" />
    <g transform="translate(14, 9)">
      <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 8.76a1.53 1.53 0 1 0-.01-3.06 1.53 1.53 0 0 0 .01 3.06m-1.4 9.74h2.79v-8.37H5.06v8.37z" fill="#0A66C2"/>
    </g>
    <text x="44" y="24" class="p-name">LinkedIn</text>
  </g>

  <!-- 2. Verified Identity Cell -->
  <g transform="translate(236, 5)">
    <rect x="0" y="0" width="456" height="38" rx="6" fill="url(#id-bg-linkedin)" stroke="rgba(10, 102, 194, 0.55)" stroke-width="1" />
    <!-- Identity Symbol / Prompt -->
    <path d="M14 19l4-4-4-4" stroke="#0a66c2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
    <text x="28" y="24" class="p-handle">hazim-bashir-faqeer</text>
  </g>

  <!-- 3. Direct Connection Action Button Cell -->
  <g transform="translate(698, 5)">
    <rect x="0" y="0" width="194" height="38" rx="6" fill="url(#btn-bg-linkedin)" stroke="rgba(10, 102, 194, 0.55)" stroke-width="1.1" />
    <text x="18" y="24" class="p-btn">CONNECT</text>
    <path d="M174 15l4 4-4 4m4-4h-8" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  </g>
</svg>