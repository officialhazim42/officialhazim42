<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 54" width="100%" height="54">
  <defs>
    <!-- Base Row Glass Gradient -->
    <linearGradient id="row-bg-youtube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060b18" stop-opacity="0.96" />
      <stop offset="26%" stop-color="#26080b" stop-opacity="0.82" />
      <stop offset="68%" stop-color="#1c0508" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#380c12" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="row-stroke-youtube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 0, 0, 0.3)" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="rgba(255, 0, 0, 0.3)" />
    </linearGradient>

    <!-- Platform Cell Gradient -->
    <linearGradient id="p-bg-youtube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26080b" />
      <stop offset="100%" stop-color="#360c11" />
    </linearGradient>

    <!-- Identity Cell Gradient -->
    <linearGradient id="id-bg-youtube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0508" />
      <stop offset="100%" stop-color="#26080b" />
    </linearGradient>

    <!-- Action Button Gradient -->
    <linearGradient id="btn-bg-youtube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#380c12" />
      <stop offset="100%" stop-color="#4d1018" />
    </linearGradient>

    <style>
      svg { overflow: visible; }
      @keyframes rowIn {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes arrowDrift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      @keyframes btnShimmer {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; stroke: #ff0000; }
      }
      .row-card {
        animation: rowIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.20s both;
      }
      .p-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
      .p-handle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
      .p-btn { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #ff6b6b; letter-spacing: 0.8px; }
      
      .p-icon {
        transform-origin: 12px 12px;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
      }
      .row-card:hover .p-icon, svg:hover .p-icon {
        transform: scale(1.12);
        filter: drop-shadow(0 0 3px #ff0000);
      }

      .btn-action-group {
        cursor: pointer;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
        transform-origin: 795px 27px;
      }
      .btn-action-group .btn-arrow {
        animation: arrowDrift 2.2s ease-in-out infinite;
        transition: transform 0.2s ease;
      }
      .btn-action-group .btn-rect {
        animation: btnShimmer 3s ease-in-out infinite;
        transition: stroke 0.2s ease, stroke-width 0.2s ease;
      }
      .btn-action-group:hover, svg:hover .btn-action-group {
        transform: translateY(-1.5px) scale(1.025);
        filter: drop-shadow(0 4px 12px rgba(255, 0, 0, 0.45));
      }
      .btn-action-group:hover .btn-rect, svg:hover .btn-action-group .btn-rect {
        stroke: #ff0000;
        stroke-width: 1.4;
      }
      .btn-action-group:hover .btn-arrow, svg:hover .btn-action-group .btn-arrow {
        transform: translateX(5px);
      }
      .btn-action-group:active, svg:active .btn-action-group {
        transform: translateY(0.5px) scale(0.98);
      }
      .btn-action-group:focus {
        outline: 2px solid #ff0000;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .row-card, .btn-action-group, .btn-arrow, .btn-rect, .p-icon {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Row Container (Centered vertically at y=4 with 46px height) -->
  <g class="row-card">
    <rect x="1" y="4" width="898" height="46" rx="8" fill="url(#row-bg-youtube)" stroke="url(#row-stroke-youtube)" stroke-width="1.1" />

    <!-- Left Accent Notch -->
    <rect x="1" y="15" width="3" height="24" rx="1.5" fill="#ff0000" />

    <!-- 1. Channel / Platform Cell -->
    <g transform="translate(8, 8)">
      <rect x="0" y="0" width="222" height="38" rx="6" fill="url(#p-bg-youtube)" stroke="rgba(255, 0, 0, 0.45)" stroke-width="1" />
      <g transform="translate(14, 9)">
        <g class="p-icon">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="#FF0000"/>
        </g>
      </g>
      <text x="44" y="24" class="p-name">YouTube</text>
    </g>

    <!-- 2. Verified Identity Cell (Handle text starts at 236 + 28 = 264) -->
    <g transform="translate(236, 8)">
      <rect x="0" y="0" width="456" height="38" rx="6" fill="url(#id-bg-youtube)" stroke="rgba(255, 0, 0, 0.45)" stroke-width="1" />
      <!-- Identity Symbol / Prompt -->
      <path d="M14 19l4-4-4-4" stroke="#ff0000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
      <text x="28" y="24" class="p-handle">@officialhazim42</text>
    </g>

    <!-- 3. Direct Connection Action Button Cell (Button label starts at 698 + 18 = 716) -->
    <g transform="translate(698, 8)" class="btn-action-group" tabindex="0" role="button">
      <rect x="0" y="0" width="194" height="38" rx="6" class="btn-rect" fill="url(#btn-bg-youtube)" stroke="rgba(255, 0, 0, 0.45)" stroke-width="1.1" />
      <text x="18" y="24" class="p-btn">VISIT CHANNEL</text>
      <g class="btn-arrow">
        <path d="M174 15l4 4-4 4m4-4h-8" stroke="#ff6b6b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
      </g>
    </g>
  </g>
</svg>