<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="48">
  <defs>
    <!-- Base Row Glass Gradient -->
    <linearGradient id="row-bg-youtube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060b18" stop-opacity="0.96" />
      <stop offset="26%" stop-color="#26080b" stop-opacity="0.82" />
      <stop offset="68%" stop-color="#1c0508" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#380c12" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="row-stroke-youtube" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 0, 0, 0.3)" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="rgba(255, 0, 0, 0.3)" />
    </linearGradient>

    <!-- Platform Cell Gradient -->
    <linearGradient id="p-bg-youtube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26080b" />
      <stop offset="100%" stop-color="#360c11" />
    </linearGradient>

    <!-- Identity Cell Gradient -->
    <linearGradient id="id-bg-youtube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0508" />
      <stop offset="100%" stop-color="#26080b" />
    </linearGradient>

    <!-- Action Button Gradient -->
    <linearGradient id="btn-bg-youtube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#380c12" />
      <stop offset="100%" stop-color="#4d1018" />
    </linearGradient>

    <style>
      .p-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
      .p-handle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
      .p-btn { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #ff6b6b; letter-spacing: 0.8px; }
    </style>
  </defs>

  <!-- Base Row Container -->
  <rect x="1" y="1" width="898" height="46" rx="8" fill="url(#row-bg-youtube)" stroke="url(#row-stroke-youtube)" stroke-width="1.1" />

  <!-- Left Accent Notch -->
  <rect x="1" y="12" width="3" height="24" rx="1.5" fill="#ff0000" />

  <!-- 1. Channel / Platform Cell -->
  <g transform="translate(8, 5)">
    <rect x="0" y="0" width="222" height="38" rx="6" fill="url(#p-bg-youtube)" stroke="rgba(255, 0, 0, 0.45)" stroke-width="1" />
    <g transform="translate(14, 9)">
      <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="#FF0000"/>
    </g>
    <text x="44" y="24" class="p-name">YouTube</text>
  </g>

  <!-- 2. Verified Identity Cell -->
  <g transform="translate(236, 5)">
    <rect x="0" y="0" width="456" height="38" rx="6" fill="url(#id-bg-youtube)" stroke="rgba(255, 0, 0, 0.45)" stroke-width="1" />
    <!-- Identity Symbol / Prompt -->
    <path d="M14 19l4-4-4-4" stroke="#ff0000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
    <text x="28" y="24" class="p-handle">@officialhazim42</text>
  </g>

  <!-- 3. Direct Connection Action Button Cell -->
  <g transform="translate(698, 5)">
    <rect x="0" y="0" width="194" height="38" rx="6" fill="url(#btn-bg-youtube)" stroke="rgba(255, 0, 0, 0.45)" stroke-width="1.1" />
    <text x="18" y="24" class="p-btn">VISIT CHANNEL</text>
    <path d="M174 15l4 4-4 4m4-4h-8" stroke="#ff6b6b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  </g>
</svg>