<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="48">
  <defs>
    <!-- Base Row Glass Gradient -->
    <linearGradient id="row-bg-threads" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060b18" stop-opacity="0.96" />
      <stop offset="26%" stop-color="#09111c" stop-opacity="0.82" />
      <stop offset="68%" stop-color="#070c14" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#101f33" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="row-stroke-threads" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.25)" />
    </linearGradient>

    <!-- Platform Cell Gradient -->
    <linearGradient id="p-bg-threads" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09111c" />
      <stop offset="100%" stop-color="#0f1c2e" />
    </linearGradient>

    <!-- Identity Cell Gradient -->
    <linearGradient id="id-bg-threads" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c14" />
      <stop offset="100%" stop-color="#0c1524" />
    </linearGradient>

    <!-- Action Button Gradient -->
    <linearGradient id="btn-bg-threads" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101f33" />
      <stop offset="100%" stop-color="#182e4c" />
    </linearGradient>

    <style>
      @keyframes rowIn {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes arrowDrift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      @keyframes btnShimmer {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; stroke: #38bdf8; }
      }
      .row-card {
        animation: rowIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.29s both;
      }
      .p-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
      .p-handle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
      .p-btn { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #93c5fd; letter-spacing: 0.8px; }
      
      .btn-action-group {
        cursor: pointer;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
        transform-origin: 795px 24px;
      }
      .btn-action-group .btn-arrow {
        animation: arrowDrift 2.2s ease-in-out infinite;
        transition: transform 0.2s ease;
      }
      .btn-action-group .btn-rect {
        animation: btnShimmer 3s ease-in-out infinite;
        transition: stroke 0.2s ease, stroke-width 0.2s ease;
      }
      .btn-action-group:hover, svg:hover .btn-action-group {
        transform: translateY(-1.5px) scale(1.025);
        filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.4));
      }
      .btn-action-group:hover .btn-rect, svg:hover .btn-action-group .btn-rect {
        stroke: #38bdf8;
        stroke-width: 1.4;
      }
      .btn-action-group:hover .btn-arrow, svg:hover .btn-action-group .btn-arrow {
        transform: translateX(5px);
      }
      .btn-action-group:active, svg:active .btn-action-group {
        transform: translateY(0.5px) scale(0.98);
      }
      .btn-action-group:focus {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .row-card, .btn-action-group, .btn-arrow, .btn-rect {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Row Container -->
  <g class="row-card">
    <rect x="1" y="1" width="898" height="46" rx="8" fill="url(#row-bg-threads)" stroke="url(#row-stroke-threads)" stroke-width="1.1" />

    <!-- Left Accent Notch -->
    <rect x="1" y="12" width="3" height="24" rx="1.5" fill="#38bdf8" />

    <!-- 1. Channel / Platform Cell -->
    <g transform="translate(8, 5)">
      <rect x="0" y="0" width="222" height="38" rx="6" fill="url(#p-bg-threads)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <g transform="translate(14, 9)">
        <path d="M12.186 2c5.44 0 9.814 4.374 9.814 9.814 0 5.44-4.374 9.814-9.814 9.814C6.746 21.628 2.372 17.254 2.372 11.814 2.372 6.374 6.746 2 12.186 2zm0 2.181c-4.237 0-7.633 3.396-7.633 7.633 0 4.237 3.396 7.633 7.633 7.633 4.237 0 7.633-3.396 7.633-7.633 0-4.237-3.396-7.633-7.633-7.633zm2.59 5.617c1.341 0 2.193.99 2.193 2.502 0 1.944-1.391 3.518-3.415 3.518-1.503 0-2.529-.906-2.529-2.235 0-1.362 1.05-2.261 2.457-2.261.42 0 .84.077 1.155.218v-.077c0-.857-.496-1.386-1.42-1.386-.706 0-1.285.319-1.638.647l-.924-1.319c.647-.613 1.63-1.076 2.894-1.076 2.05 0 3.227 1.151 3.227 3.37v4.613h-1.94v-.924h-.059c-.479.68-1.319 1.058-2.235 1.058-1.899 0-3.37-1.361-3.37-3.218 0-1.823 1.47-3.218 3.538-3.218.428 0 .865.05 1.252.16v-.084c0-.79-.479-1.218-1.311-1.218-.622 0-1.151.277-1.47.546l-.882-1.277c.605-.538 1.487-.933 2.546-.933zm.252 4.143c-.227-.084-.538-.134-.84-.134-.966 0-1.63.571-1.63 1.437 0 .824.63 1.378 1.504 1.378 1.017 0 1.748-.731 1.748-1.807v-.874z" fill="#F8FAFC"/>
      </g>
      <text x="44" y="24" class="p-name">Threads</text>
    </g>

    <!-- 2. Verified Identity Cell -->
    <g transform="translate(236, 5)">
      <rect x="0" y="0" width="456" height="38" rx="6" fill="url(#id-bg-threads)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <!-- Identity Symbol / Prompt -->
      <path d="M14 19l4-4-4-4" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
      <text x="28" y="24" class="p-handle">@officialhazim42</text>
    </g>

    <!-- 3. Direct Connection Action Button Cell with Hover, Lift & Arrow Shift -->
    <g transform="translate(698, 5)" class="btn-action-group" tabindex="0" role="button">
      <rect x="0" y="0" width="194" height="38" rx="6" class="btn-rect" fill="url(#btn-bg-threads)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.1" />
      <text x="18" y="24" class="p-btn">VIEW THREADS</text>
      <g class="btn-arrow">
        <path d="M174 15l4 4-4 4m4-4h-8" stroke="#93c5fd" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
      </g>
    </g>
  </g>
</svg>