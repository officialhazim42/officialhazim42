<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="48">
  <defs>
    <!-- Base Row Glass Gradient -->
    <linearGradient id="row-bg-location" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060b18" stop-opacity="0.96" />
      <stop offset="26%" stop-color="#061d24" stop-opacity="0.82" />
      <stop offset="68%" stop-color="#04151a" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#092c36" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="row-stroke-location" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.35)" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="rgba(6, 182, 212, 0.35)" />
    </linearGradient>

    <!-- Platform Cell Gradient -->
    <linearGradient id="p-bg-location" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061d24" />
      <stop offset="100%" stop-color="#0a2a33" />
    </linearGradient>

    <!-- Identity Cell Gradient -->
    <linearGradient id="id-bg-location" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04151a" />
      <stop offset="100%" stop-color="#072129" />
    </linearGradient>

    <!-- Action Button Gradient -->
    <linearGradient id="btn-bg-location" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#092c36" />
      <stop offset="100%" stop-color="#0e3f4c" />
    </linearGradient>

    <style>
      @keyframes rowIn {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes arrowDrift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      @keyframes btnShimmer {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; stroke: #06b6d4; }
      }
      .row-card {
        animation: rowIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.45s both;
      }
      .p-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
      .p-handle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
      .p-btn { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #67e8f9; letter-spacing: 0.8px; }
      
      .btn-action-group {
        cursor: pointer;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
        transform-origin: 795px 24px;
      }
      .btn-action-group .btn-arrow {
        animation: arrowDrift 2.2s ease-in-out infinite;
        transition: transform 0.2s ease;
      }
      .btn-action-group .btn-rect {
        animation: btnShimmer 3s ease-in-out infinite;
        transition: stroke 0.2s ease, stroke-width 0.2s ease;
      }
      .btn-action-group:hover, svg:hover .btn-action-group {
        transform: translateY(-1.5px) scale(1.025);
        filter: drop-shadow(0 4px 12px rgba(6, 182, 212, 0.45));
      }
      .btn-action-group:hover .btn-rect, svg:hover .btn-action-group .btn-rect {
        stroke: #06b6d4;
        stroke-width: 1.4;
      }
      .btn-action-group:hover .btn-arrow, svg:hover .btn-action-group .btn-arrow {
        transform: translateX(5px);
      }
      .btn-action-group:active, svg:active .btn-action-group {
        transform: translateY(0.5px) scale(0.98);
      }
      .btn-action-group:focus {
        outline: 2px solid #06b6d4;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .row-card, .btn-action-group, .btn-arrow, .btn-rect {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Row Container -->
  <g class="row-card">
    <rect x="1" y="1" width="898" height="46" rx="8" fill="url(#row-bg-location)" stroke="url(#row-stroke-location)" stroke-width="1.1" />

    <!-- Left Accent Notch -->
    <rect x="1" y="12" width="3" height="24" rx="1.5" fill="#06b6d4" />

    <!-- 1. Channel / Platform Cell -->
    <g transform="translate(8, 5)">
      <rect x="0" y="0" width="222" height="38" rx="6" fill="url(#p-bg-location)" stroke="rgba(6, 182, 212, 0.55)" stroke-width="1" />
      <g transform="translate(14, 9)">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#06B6D4"/>
      </g>
      <text x="44" y="24" class="p-name">Base Location</text>
    </g>

    <!-- 2. Verified Identity Cell -->
    <g transform="translate(236, 5)">
      <rect x="0" y="0" width="456" height="38" rx="6" fill="url(#id-bg-location)" stroke="rgba(6, 182, 212, 0.55)" stroke-width="1" />
      <!-- Identity Symbol / Prompt -->
      <path d="M14 19l4-4-4-4" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
      <text x="28" y="24" class="p-handle">Ganderbal, Jammu &amp; Kashmir, India</text>
    </g>

    <!-- 3. Direct Connection Action Button Cell with Hover, Lift & Arrow Shift -->
    <g transform="translate(698, 5)" class="btn-action-group" tabindex="0" role="button">
      <rect x="0" y="0" width="194" height="38" rx="6" class="btn-rect" fill="url(#btn-bg-location)" stroke="rgba(6, 182, 212, 0.55)" stroke-width="1.1" />
      <text x="18" y="24" class="p-btn">OPEN MAPS</text>
      <g class="btn-arrow">
        <path d="M174 15l4 4-4 4m4-4h-8" stroke="#67e8f9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
      </g>
    </g>
  </g>
</svg>