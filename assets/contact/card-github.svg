<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 60" width="100%" height="60" style="overflow: visible;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg-github" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081329" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#0d1f42" stop-opacity="0.94" />
      <stop offset="75%" stop-color="#08152e" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#071126" stop-opacity="0.98" />
    </linearGradient>

    <!-- Card Stroke Gradient -->
    <linearGradient id="card-stroke-github" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(240, 246, 252, 0.4)" />
      <stop offset="30%" stop-color="rgba(56, 189, 248, 0.35)" />
      <stop offset="70%" stop-color="rgba(14, 165, 233, 0.3)" />
      <stop offset="100%" stop-color="rgba(240, 246, 252, 0.4)" />
    </linearGradient>

    <!-- Logo Glow -->
    <radialGradient id="logo-glow-github" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f6fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f0f6fc" stop-opacity="0" />
    </radialGradient>

    <!-- STAGE A: Platform Name Clip -->
    <clipPath id="clip-pname-github">
      <rect x="32" y="6" width="0" height="34">
        <animate
          attributeName="width"
          dur="8s"
          begin="0s"
          repeatCount="indefinite"
          keyTimes="0; 0.025; 0.125; 0.25; 0.312; 0.35; 1"
          values="0; 0; 64; 64; 0; 0; 0"
          calcMode="linear"
        />
      </rect>
    </clipPath>

    <!-- STAGE B: Verified Handle Clip (3-4s reading pause) -->
    <clipPath id="clip-handle-github">
      <rect x="32" y="6" width="0" height="34">
        <animate
          attributeName="width"
          dur="8s"
          begin="0s"
          repeatCount="indefinite"
          keyTimes="0; 0.35; 0.487; 0.887; 0.975; 1"
          values="0; 0; 148; 148; 0; 0"
          calcMode="linear"
        />
      </rect>
    </clipPath>

    <style>
      svg { overflow: visible; }
      .card-box {
        transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), filter 0.24s ease;
      }
      .card-box:hover, svg:hover .card-box {
        filter: drop-shadow(0 6px 20px rgba(56, 189, 248, 0.28));
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 14.5px;
        font-weight: 600;
      }
      .text-pname {
        fill: #38bdf8;
        font-weight: 700;
        letter-spacing: 0.4px;
      }
      .text-handle {
        fill: #f0f6fc;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .prompt {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 15px;
        font-weight: 800;
        fill: #38bdf8;
      }
      .cursor {
        fill: #38bdf8;
      }

      /* Right Side Action Button with Unified Interactive System */
      .btn-action-group {
        cursor: pointer;
        transform-origin: 790px 30px;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
      }
      .btn-action-group .btn-rect {
        transition: stroke 0.2s ease, stroke-width 0.2s ease, fill 0.2s ease;
      }
      .btn-action-group .btn-arrow-icon {
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #f8fafc;
        letter-spacing: 1px;
      }
      
      /* Hover State: Smooth lift, subtle scale (1.028), platform-colored glow, arrow slide */
      .card-box:hover .btn-action-group, svg:hover .btn-action-group {
        transform: translateY(-1.5px) scale(1.028);
        filter: drop-shadow(0 4px 14px rgba(240, 246, 252, 0.3));
      }
      .card-box:hover .btn-rect, svg:hover .btn-rect {
        stroke: #f0f6fc;
        stroke-width: 1.4;
        fill: #132b57;
      }
      .card-box:hover .btn-arrow-icon, svg:hover .btn-arrow-icon {
        transform: translateX(4px);
      }
      .card-box:active .btn-action-group, svg:active .btn-action-group {
        transform: translateY(0.5px) scale(0.98);
      }
      .btn-action-group:focus {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        *, .card-box, .cursor, rect, path, text, .btn-action-group, .btn-arrow-icon {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </defs>

  <g class="card-box">
    <!-- Card Frame -->
    <rect x="1" y="2" width="898" height="56" rx="10" fill="url(#card-bg-github)" stroke="url(#card-stroke-github)" stroke-width="1.1" />

    <!-- Left Platform Brand Accent Notch -->
    <rect x="1" y="14" width="3.5" height="32" rx="1.75" fill="#f0f6fc" />

    <!-- PHASE 1: Platform Logo Icon (with subtle fade/scale entrance) -->
    <g transform="translate(14, 9)">
      <circle cx="21" cy="21" r="23" fill="url(#logo-glow-github)" />
      <rect x="0" y="0" width="42" height="42" rx="8" fill="#091122" stroke="rgba(240, 246, 252, 0.4)" stroke-width="1" />
      <g transform="translate(9, 9)">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill="#F0F6FC"/>
      </g>
    </g>

    <!-- Dynamic Terminal Display Container -->
    <g transform="translate(68, 9)">
      <rect x="0" y="0" width="616" height="42" rx="7" fill="#050c1c" stroke="#16284a" stroke-width="1" />
      
      <!-- Terminal Prompt Symbol -->
      <text x="14" y="26" class="prompt">&gt;</text>

      <!-- STAGE A: Platform Name Text -->
      <g clip-path="url(#clip-pname-github)">
        <text x="32" y="26" class="mono-text text-pname">GitHub</text>
      </g>

      <!-- STAGE B: Verified Handle Text (3-4s reading hold) -->
      <g clip-path="url(#clip-handle-github)">
        <text x="32" y="26" class="mono-text text-handle">@officialhazim42</text>
      </g>

      <!-- Dynamic Blinking Keystroke Cursor that tracks typing and backspacing -->
      <rect y="12" width="2.2" height="18" rx="1" class="cursor">
        <animate
          attributeName="x"
          dur="8s"
          begin="0s"
          repeatCount="indefinite"
          keyTimes="0; 0.025; 0.125; 0.25; 0.312; 0.35; 0.487; 0.887; 0.975; 1"
          values="32; 32; 96; 96; 32; 32; 180; 180; 32; 32"
          calcMode="linear"
        />
        <animate
          attributeName="opacity"
          dur="0.8s"
          repeatCount="indefinite"
          values="1; 1; 0; 0"
          keyTimes="0; 0.5; 0.51; 1"
        />
      </rect>
    </g>

    <!-- Right Side Attractive Action Button -->
    <g transform="translate(696, 9)" class="btn-action-group" role="button" tabindex="0">
      <rect x="0" y="0" width="188" height="42" rx="8" class="btn-rect" fill="#0d1f42" stroke="rgba(240, 246, 252, 0.4)" stroke-width="1.1" />
      <text x="38" y="26" class="btn-label">CONNECT</text>
      <g transform="translate(150, 15)" class="btn-arrow-icon">
        <path d="M0 6h14m-5-5l5 5-5 5" stroke="#f0f6fc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <animateTransform
            attributeName="transform"
            type="translate"
            dur="2.4s"
            repeatCount="indefinite"
            values="0,0; 3,0; 0,0"
            keyTimes="0; 0.5; 1"
          />
        </path>
      </g>
    </g>
  </g>
</svg>