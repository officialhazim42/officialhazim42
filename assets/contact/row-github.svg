<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 54" width="100%" height="54">
  <defs>
    <!-- Base Row Glass Gradient -->
    <linearGradient id="row-bg-github" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060b18" stop-opacity="0.96" />
      <stop offset="26%" stop-color="#0d1117" stop-opacity="0.82" />
      <stop offset="68%" stop-color="#090d13" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="row-stroke-github" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(240, 246, 252, 0.25)" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="rgba(240, 246, 252, 0.25)" />
    </linearGradient>

    <!-- Platform Cell Gradient -->
    <linearGradient id="p-bg-github" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Identity Cell Gradient -->
    <linearGradient id="id-bg-github" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d13" />
      <stop offset="100%" stop-color="#121820" />
    </linearGradient>

    <!-- Action Button Gradient -->
    <linearGradient id="btn-bg-github" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#21262d" />
    </linearGradient>

    <style>
      svg { overflow: visible; }
      @keyframes rowIn {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes arrowDrift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      @keyframes btnShimmer {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; stroke: #f0f6fc; }
      }
      .row-card {
        animation: rowIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.04s both;
      }
      .p-name { font-family: system-ui, -apple-system, sans-serif; font-size: 13.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.3px; }
      .p-handle { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #cbd5e1; }
      .p-btn { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #f0f6fc; letter-spacing: 0.8px; }
      
      .p-icon {
        transform-origin: 12px 12px;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
      }
      .row-card:hover .p-icon, svg:hover .p-icon {
        transform: scale(1.12);
        filter: drop-shadow(0 0 3px #f0f6fc);
      }

      .btn-action-group {
        cursor: pointer;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
        transform-origin: 795px 27px;
      }
      .btn-action-group .btn-arrow {
        animation: arrowDrift 2.2s ease-in-out infinite;
        transition: transform 0.2s ease;
      }
      .btn-action-group .btn-rect {
        animation: btnShimmer 3s ease-in-out infinite;
        transition: stroke 0.2s ease, stroke-width 0.2s ease;
      }
      .btn-action-group:hover, svg:hover .btn-action-group {
        transform: translateY(-1.5px) scale(1.025);
        filter: drop-shadow(0 4px 12px rgba(240, 246, 252, 0.45));
      }
      .btn-action-group:hover .btn-rect, svg:hover .btn-action-group .btn-rect {
        stroke: #f0f6fc;
        stroke-width: 1.4;
      }
      .btn-action-group:hover .btn-arrow, svg:hover .btn-action-group .btn-arrow {
        transform: translateX(5px);
      }
      .btn-action-group:active, svg:active .btn-action-group {
        transform: translateY(0.5px) scale(0.98);
      }
      .btn-action-group:focus {
        outline: 2px solid #f0f6fc;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .row-card, .btn-action-group, .btn-arrow, .btn-rect, .p-icon {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Base Row Container (Centered vertically at y=4 with 46px height) -->
  <g class="row-card">
    <rect x="1" y="4" width="898" height="46" rx="8" fill="url(#row-bg-github)" stroke="url(#row-stroke-github)" stroke-width="1.1" />

    <!-- Left Accent Notch -->
    <rect x="1" y="15" width="3" height="24" rx="1.5" fill="#f0f6fc" />

    <!-- 1. Channel / Platform Cell -->
    <g transform="translate(8, 8)">
      <rect x="0" y="0" width="222" height="38" rx="6" fill="url(#p-bg-github)" stroke="#30363d" stroke-width="1" />
      <g transform="translate(14, 9)">
        <g class="p-icon">
          <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill="#F0F6FC"/>
        </g>
      </g>
      <text x="44" y="24" class="p-name">GitHub</text>
    </g>

    <!-- 2. Verified Identity Cell (Handle text starts at 236 + 28 = 264) -->
    <g transform="translate(236, 8)">
      <rect x="0" y="0" width="456" height="38" rx="6" fill="url(#id-bg-github)" stroke="#30363d" stroke-width="1" />
      <!-- Identity Symbol / Prompt -->
      <path d="M14 19l4-4-4-4" stroke="#f0f6fc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
      <text x="28" y="24" class="p-handle">@officialhazim42</text>
    </g>

    <!-- 3. Direct Connection Action Button Cell (Button label starts at 698 + 18 = 716) -->
    <g transform="translate(698, 8)" class="btn-action-group" tabindex="0" role="button">
      <rect x="0" y="0" width="194" height="38" rx="6" class="btn-rect" fill="url(#btn-bg-github)" stroke="#30363d" stroke-width="1.1" />
      <text x="18" y="24" class="p-btn">VIEW PROFILE</text>
      <g class="btn-arrow">
        <path d="M174 15l4 4-4 4m4-4h-8" stroke="#f0f6fc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
      </g>
    </g>
  </g>
</svg>