<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 38" width="100%" height="38">
  <defs>
    <linearGradient id="th-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#0d1936" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#071022" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="th-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <style>
      @keyframes thEntrance {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes thJewel {
        0%, 100% { r: 3; opacity: 0.85; filter: drop-shadow(0 0 2px #38bdf8); }
        50% { r: 4; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      .th-root {
        animation: thEntrance 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .th-pulse-dot {
        animation: thJewel 2.4s ease-in-out infinite;
      }
      .th-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .th-root, .th-pulse-dot {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <g class="th-root">
    <rect x="1" y="2" width="898" height="32" rx="7" fill="url(#th-bg)" stroke="url(#th-stroke)" stroke-width="1.1" />
    <!-- Column 1 Header -->
    <circle cx="16" cy="18" r="3" fill="#38bdf8" class="th-pulse-dot" />
    <text x="28" y="22" class="th-label">CHANNEL / PLATFORM</text>

    <!-- Column 2 Header (Aligned precisely with handle text at x=264) -->
    <circle cx="252" cy="18" r="2.5" fill="#38bdf8" opacity="0.75" />
    <text x="264" y="22" class="th-label">VERIFIED IDENTITY</text>

    <!-- Column 3 Header (Aligned precisely with button label at x=716) -->
    <circle cx="704" cy="18" r="2.5" fill="#38bdf8" opacity="0.75" />
    <text x="716" y="22" class="th-label">DIRECT CONNECTION</text>
  </g>
</svg>