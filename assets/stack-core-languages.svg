      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11.5px; font-weight: 400; fill: #94a3b8; }
      .c-name { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #f8fafc; }
      .c-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 8.5px; font-weight: 500; fill: #94a3b8; }
      .badge-txt { font-family: system-ui, -apple-system, sans-serif; font-size: 7.5px; font-weight: 800; letter-spacing: 0.5px; text-anchor: middle; }
