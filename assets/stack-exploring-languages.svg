      <g transform="translate(10, 11)"><ellipse cx="12" cy="12" rx="11" ry="7" fill="#777BB4"/><path d="M6 10h2.2c.9 0 1.5.3 1.5 1s-.6 1-1.5 1H7.1L6.6 14H5.3L6 10zm1.7 1.4h.6c.4 0 .7-.1.7-.4s-.3-.4-.7-.4h-.5l-.1.8zm3.8-1.4h1.3l-.4 1.8h1.2c.9 0 1.5.3 1.5 1s-.6 1-1.5 1h-1.3L13 14h-1.3l.7-2.6h-.7l.2-.9h.7l.2-.5zm1.7 2.2h.6c.4 0 .7-.1.7-.4s-.3-.4-.7-.4h-.5l-.1.8zm3.5-2.2h2.2c.9 0 1.5.3 1.5 1s-.6 1-1.5 1h-1.1l-.5 2h-1.3l.7-4zm1.7 1.4h.6c.4 0 .7-.1.7-.4s-.3-.4-.7-.4h-.5l-.1.8z" fill="#FFFFFF"/></g>
      <text x="36" y="20" class="c-name">PHP</text>
      <text x="36" y="34" class="c-sub">Backend Exploration</text>
