        <text x="30.099999999999998" y="9.5" fill="#C084FC" class="badge-txt">EXPLORING</text>
      </g>
    </g>
    <g transform="translate(355, 102)">
      <rect width="190" height="48" rx="8" fill="url(#card-inner-bg)" stroke="#1E3A5F" stroke-width="1.1" />
      <g transform="translate(10, 11)"><path d="M2.5 10c0-2.5 2-4.5 4.5-4.5 2.1 0 3.8 1.4 4.3 3.3h-2.3C8.6 7.8 7.8 7.3 7 7.3c-1.5 0-2.7 1.2-2.7 2.7s1.2 2.7 2.7 2.7c1 0 1.8-.5 2.1-1.3H6.8v-1.8h4.5v3.4C10.4 14.1 8.8 15 7 15c-2.5 0-4.5-2-4.5-5zm10.5 0c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5-2 4.5-4.5 4.5-4.5-2-4.5-4.5zm7 0c0-1.5-1.1-2.7-2.5-2.7s-2.5 1.2-2.5 2.7 1.1 2.7 2.5 2.7 2.5-1.2 2.5-2.7z" fill="#00ADD8"/></g>
      <text x="36" y="20" class="c-name">Go (Golang)</text>
      <text x="36" y="34" class="c-sub">Concurrency &amp; Systems</text>
      <g transform="translate(123.80000000000001, 6)">
        <rect width="60.199999999999996" height="13" rx="3" fill="#083344" stroke="#38BDF8" stroke-width="0.8" opacity="0.9"/>
        <text x="30.099999999999998" y="9.5" fill="#38BDF8" class="badge-txt">EXPLORING</text>
      </g>
    </g>
    <g transform="translate(575, 102)">
      <rect width="190" height="48" rx="8" fill="url(#card-inner-bg)" stroke="#1E3A5F" stroke-width="1.1" />
      <g transform="translate(10, 11)"><circle cx="12" cy="12" r="10" fill="#1C1E24" stroke="#DEA584" stroke-width="1.8"/><path d="M9 7h3.5c1.4 0 2.5.8 2.5 2.2 0 1-.6 1.7-1.5 2l1.8 3.8h-1.8l-1.6-3.5H10.6v3.5H9V7zm1.6 3.2h1.8c.6 0 1-.3 1-.9 0-.5-.4-.8-1-.8h-1.8v1.7z" fill="#FFFFFF"/></g>
      <text x="36" y="20" class="c-name">Rust</text>
      <text x="36" y="34" class="c-sub">Safe Systems Engine</text>
      <g transform="translate(123.80000000000001, 6)">
        <rect width="60.199999999999996" height="13" rx="3" fill="#431407" stroke="#F97316" stroke-width="0.8" opacity="0.9"/>
        <text x="30.099999999999998" y="9.5" fill="#F97316" class="badge-txt">EXPLORING</text>
