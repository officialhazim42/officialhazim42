<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 58" width="100%" height="58">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sec-bg-03" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0c1833" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.96" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="sec-stroke-03" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Indicator Accent Gradient -->
    <linearGradient id="ind-grad-03" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Underline Accent Gradient -->
    <linearGradient id="acc-grad-03" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Reveal Clip Path -->
    <clipPath id="clip-03">
      <rect x="120" y="8" width="500" height="42" class="clip-rect" />
    </clipPath>

    <style>
      .mono-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .sec-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 16.5px;
        font-weight: 800;
        letter-spacing: 1.2px;
        fill: #ffffff;
      }
      .slash-accent {
        fill: #38bdf8;
        font-weight: 900;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #94a3b8;
      }

      /* Dynamic Keyframe Animations */
      .clip-rect {
        animation: textReveal-03 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .text-cursor {
        animation: cursorTrack-03 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .accent-line {
        stroke-dasharray: 145;
        stroke-dashoffset: 0;
        animation: drawAccent-03 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .left-indicator {
        animation: pulseIndicator 4s ease-in-out infinite;
      }
      .divider-filament {
        animation: pulseFilament 4s ease-in-out infinite;
      }
      .status-dot {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .term-prompt {
        opacity: 0.25;
        animation: termPromptSeq 3.6s ease-in-out infinite;
        will-change: opacity, filter;
      }
      .term-cursor {
        animation: termCursorBlink 1.2s step-end infinite;
      }
      .term-short-line {
        stroke-dasharray: 14;
        stroke-dashoffset: 14;
        opacity: 0;
        animation: shortLineDrawSeq 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: stroke-dashoffset, opacity, filter;
      }
      .stack-seg {
        opacity: 0;
        will-change: opacity, filter;
      }
      .stack-seg-1 { animation: stackSeg1Seq 3.6s ease-out infinite; }
      .stack-seg-2 { animation: stackSeg2Seq 3.6s ease-out infinite; }
      .stack-seg-3 { animation: stackSeg3Seq 3.6s ease-out infinite; }
      .stack-seg-4 { animation: stackSeg4Seq 3.6s ease-out infinite; }
      .stack-seg-5 { animation: stackSeg5Seq 3.6s ease-out infinite; }
      .stack-seg-6 { animation: stackSeg6Seq 3.6s ease-out infinite; }
      .stack-seg-7 { animation: stackSeg7Seq 3.6s ease-out infinite; }
      .stack-seg-8 { animation: stackSeg8Seq 3.6s ease-out infinite; }
      .stack-bus-dot {
        opacity: 0.4;
        animation: stackBusDotSeq 3.6s ease-in-out infinite;
        will-change: opacity, fill, filter;
      }

      @keyframes textReveal-03 {
        0% { width: 0; }
        15% { width: 212px; }
        88% { width: 212px; opacity: 1; }
        96% { width: 212px; opacity: 0.8; }
        100% { width: 0; opacity: 0; }
      }

      @keyframes cursorTrack-03 {
        0% { transform: translateX(0); opacity: 1; }
        15% { transform: translateX(204px); opacity: 1; }
        19%, 27%, 35% { opacity: 0; }
        23%, 31% { opacity: 1; }
        39%, 88% { opacity: 0; transform: translateX(204px); }
        96% { opacity: 0.5; transform: translateX(204px); }
        100% { opacity: 0; transform: translateX(0); }
      }

      @keyframes drawAccent-03 {
        0%, 5% { stroke-dashoffset: 145; opacity: 0; }
        18% { stroke-dashoffset: 0; opacity: 1; }
        88% { stroke-dashoffset: 0; opacity: 0.9; }
        96% { opacity: 0; stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 145; opacity: 0; }
      }

      @keyframes pulseIndicator {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
      }

      @keyframes pulseFilament {
        0%, 100% { stroke: #1e3a5f; }
        50% { stroke: #38bdf8; }
      }

      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
      }

      @keyframes termCursorBlink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }

      /* Phase 1: Terminal Prompt Reveal (0s - 0.25s), hold through 2.7s, reset */
      @keyframes termPromptSeq {
        0% { opacity: 0.25; filter: none; }
        6.9% { opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
        75% { opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
        83.3%, 100% { opacity: 0.25; filter: none; }
      }

      /* Phase 2: Short Horizontal Line Draws (0.25s - 0.60s), hold through 2.6s, retracts */
      @keyframes shortLineDrawSeq {
        0%, 6.9% { stroke-dashoffset: 14; opacity: 0; filter: none; }
        16.7% { stroke-dashoffset: 0; opacity: 1; filter: drop-shadow(0 0 2.5px #38bdf8); }
        72.2% { stroke-dashoffset: 0; opacity: 1; filter: drop-shadow(0 0 2.5px #38bdf8); }
        80.6%, 100% { stroke-dashoffset: 14; opacity: 0; filter: none; }
      }

      /* Phase 3: Sequential Dotted Line Illumination (0.60s - 1.40s) */
      @keyframes stackSeg1Seq {
        0%, 16.7% { opacity: 0; filter: none; }
        18.9% { opacity: 1; filter: drop-shadow(0 0 3px #67e8f9); }
        20.0%, 69.4% { opacity: 0.75; filter: drop-shadow(0 0 1.5px #38bdf8); }
        77.8%, 100% { opacity: 0; filter: none; }
      }
      @keyframes stackSeg2Seq {
        0%, 19.4% { opacity: 0; filter: none; }
        21.7% { opacity: 1; filter: drop-shadow(0 0 3px #67e8f9); }
        22.8%, 69.4% { opacity: 0.75; filter: drop-shadow(0 0 1.5px #38bdf8); }
        77.8%, 100% { opacity: 0; filter: none; }
      }
      @keyframes stackSeg3Seq {
        0%, 22.2% { opacity: 0; filter: none; }
        24.4% { opacity: 1; filter: drop-shadow(0 0 3px #67e8f9); }
        25.6%, 69.4% { opacity: 0.75; filter: drop-shadow(0 0 1.5px #38bdf8); }
        77.8%, 100% { opacity: 0; filter: none; }
      }
      @keyframes stackSeg4Seq {
        0%, 25.0% { opacity: 0; filter: none; }
        27.2% { opacity: 1; filter: drop-shadow(0 0 3px #67e8f9); }
        28.3%, 69.4% { opacity: 0.75; filter: drop-shadow(0 0 1.5px #38bdf8); }
        77.8%, 100% { opacity: 0; filter: none; }
      }
      @keyframes stackSeg5Seq {
        0%, 27.8% { opacity: 0; filter: none; }
        30.0% { opacity: 1; filter: drop-shadow(0 0 3px #67e8f9); }
        31.1%, 69.4% { opacity: 0.75; filter: drop-shadow(0 0 1.5px #38bdf8); }
        77.8%, 100% { opacity: 0; filter: none; }
      }
      @keyframes stackSeg6Seq {
        0%, 30.6% { opacity: 0; filter: none; }
        32.8% { opacity: 1; filter: drop-shadow(0 0 3px #67e8f9); }
        33.9%, 69.4% { opacity: 0.75; filter: drop-shadow(0 0 1.5px #38bdf8); }
        77.8%, 100% { opacity: 0; filter: none; }
      }
      @keyframes stackSeg7Seq {
        0%, 33.3% { opacity: 0; filter: none; }
        35.6% { opacity: 1; filter: drop-shadow(0 0 3px #67e8f9); }
        36.7%, 69.4% { opacity: 0.75; filter: drop-shadow(0 0 1.5px #38bdf8); }
        77.8%, 100% { opacity: 0; filter: none; }
      }
      @keyframes stackSeg8Seq {
        0%, 36.1% { opacity: 0; filter: none; }
        38.3% { opacity: 1; filter: drop-shadow(0 0 3px #67e8f9); }
        39.4%, 69.4% { opacity: 0.75; filter: drop-shadow(0 0 1.5px #38bdf8); }
        77.8%, 100% { opacity: 0; filter: none; }
      }

      /* Phase 4: Endpoint Dot Glows (activates after dotted line at 40.3%), holds, fades */
      @keyframes stackBusDotSeq {
        0%, 40.3% { opacity: 0.4; fill: #0284c7; filter: none; }
        47.2%, 66.7% { opacity: 1; fill: #38bdf8; filter: drop-shadow(0 0 4.5px #38bdf8); }
        75.0%, 100% { opacity: 0.4; fill: #0284c7; filter: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .text-cursor, .clip-rect {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Glass Card Background -->
  <rect x="1" y="1" width="898" height="56" rx="10" fill="url(#sec-bg-03)" stroke="url(#sec-stroke-03)" stroke-width="1.2" />

  <!-- Left Animated Glowing Indicator -->
  <rect class="left-indicator" x="1" y="10" width="4" height="38" rx="2" fill="url(#ind-grad-03)" />

  <!-- Section Number Badge Pill -->
  <g transform="translate(22, 15)">
    <rect width="64" height="28" rx="6" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <text x="32" y="14" text-anchor="middle" dominant-baseline="central" class="mono-badge">◈ 03</text>
  </g>

  <!-- Vertical Divider Filament -->
  <line x1="102" y1="14" x2="102" y2="44" stroke="#1e3a5f" stroke-width="1" class="divider-filament" />
  <circle cx="102" cy="18" r="1.8" fill="#38bdf8" />
  <circle cx="102" cy="40" r="1.8" fill="#0284c7" />

  <!-- Main Section Title with Animated Progressive Reveal -->
  <g clip-path="url(#clip-03)">
    <text class="sec-title" x="120" y="36">TECHNOLOGY STACK</text>
  </g>

  <!-- Traveling Typing Cursor -->
  <rect class="text-cursor" x="120" y="20" width="2" height="20" rx="1" fill="#38bdf8" />

  <!-- Subtle Animated Underline Accent -->
  <line class="accent-line" x1="120" y1="46" x2="265" y2="46" stroke="url(#acc-grad-03)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Section-Specific Right Visual Marker and Telemetry -->
    <!-- Right Motif: Terminal Command Detail & Circuit Bus -->
  <g transform="translate(655, 17)">
    <!-- Terminal Prompt: Reveals first (0s - 0.25s) with subtle cyan highlight -->
    <text x="0" y="12" dominant-baseline="central" class="mono-badge term-prompt" opacity="0.25">&gt;<tspan class="term-cursor">_</tspan>
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0.25; 1; 1; 0.25; 0.25"
               keyTimes="0; 0.069; 0.75; 0.833; 1" />
    </text>

    <!-- Underlying Guide Tracks (Dim Background) -->
    <line x1="24" y1="12" x2="38" y2="12" stroke="#1e3a5f" stroke-width="1" />
    <line x1="38" y1="12" x2="85" y2="12" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Short Horizontal Line: Draws smoothly after terminal prompt (0.25s - 0.60s) -->
    <line class="term-short-line" x1="24" y1="12" x2="38" y2="12" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="14" stroke-dashoffset="14" opacity="0">
      <animate attributeName="stroke-dashoffset" dur="3.6s" repeatCount="indefinite"
               values="14; 14; 0; 0; 14; 14"
               keyTimes="0; 0.069; 0.167; 0.722; 0.806; 1" />
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 0; 1; 1; 0; 0"
               keyTimes="0; 0.069; 0.167; 0.722; 0.806; 1" />
    </line>

    <!-- Sequential Left-to-Right Illuminated Dotted Segments (38 to 83) -->
    <!-- Segment 1 (x: 38-41) -->
    <line class="stack-seg stack-seg-1" x1="38" y1="12" x2="41" y2="12" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 0; 1; 0.75; 0.75; 0; 0"
               keyTimes="0; 0.167; 0.189; 0.200; 0.694; 0.778; 1" />
    </line>
    <!-- Segment 2 (x: 44-47) -->
    <line class="stack-seg stack-seg-2" x1="44" y1="12" x2="47" y2="12" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 0; 1; 0.75; 0.75; 0; 0"
               keyTimes="0; 0.194; 0.217; 0.228; 0.694; 0.778; 1" />
    </line>
    <!-- Segment 3 (x: 50-53) -->
    <line class="stack-seg stack-seg-3" x1="50" y1="12" x2="53" y2="12" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 0; 1; 0.75; 0.75; 0; 0"
               keyTimes="0; 0.222; 0.244; 0.256; 0.694; 0.778; 1" />
    </line>
    <!-- Segment 4 (x: 56-59) -->
    <line class="stack-seg stack-seg-4" x1="56" y1="12" x2="59" y2="12" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 0; 1; 0.75; 0.75; 0; 0"
               keyTimes="0; 0.250; 0.272; 0.283; 0.694; 0.778; 1" />
    </line>
    <!-- Segment 5 (x: 62-65) -->
    <line class="stack-seg stack-seg-5" x1="62" y1="12" x2="65" y2="12" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 0; 1; 0.75; 0.75; 0; 0"
               keyTimes="0; 0.278; 0.300; 0.311; 0.694; 0.778; 1" />
    </line>
    <!-- Segment 6 (x: 68-71) -->
    <line class="stack-seg stack-seg-6" x1="68" y1="12" x2="71" y2="12" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 0; 1; 0.75; 0.75; 0; 0"
               keyTimes="0; 0.306; 0.328; 0.339; 0.694; 0.778; 1" />
    </line>
    <!-- Segment 7 (x: 74-77) -->
    <line class="stack-seg stack-seg-7" x1="74" y1="12" x2="77" y2="12" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 0; 1; 0.75; 0.75; 0; 0"
               keyTimes="0; 0.333; 0.356; 0.367; 0.694; 0.778; 1" />
    </line>
    <!-- Segment 8 (x: 80-83) -->
    <line class="stack-seg stack-seg-8" x1="80" y1="12" x2="83" y2="12" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 0; 1; 0.75; 0.75; 0; 0"
               keyTimes="0; 0.361; 0.383; 0.394; 0.694; 0.778; 1" />
    </line>

    <!-- Endpoint Dot: Brightens with cyan/blue glow ONLY AFTER dotted line completes illumination -->
    <circle cx="85" cy="12" r="2.5" fill="#0284c7" class="stack-bus-dot" opacity="0.4">
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0.4; 0.4; 1; 1; 0.4; 0.4"
               keyTimes="0; 0.403; 0.472; 0.667; 0.750; 1" />
      <animate attributeName="fill" dur="3.6s" repeatCount="indefinite"
               values="#0284c7; #0284c7; #38bdf8; #38bdf8; #0284c7; #0284c7"
               keyTimes="0; 0.403; 0.472; 0.667; 0.750; 1" />
    </circle>

    <rect x="95" y="0" width="135" height="24" rx="5" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="108" cy="12" r="3" fill="#3b82f6" />
    <text x="119" y="12" dominant-baseline="central" class="mono-meta">STACK MATRIX</text>
  </g>
</svg>