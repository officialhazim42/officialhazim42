<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 58" width="100%" height="58">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sec-bg-08" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0c1833" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.96" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="sec-stroke-08" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Indicator Accent Gradient -->
    <linearGradient id="ind-grad-08" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Underline Accent Gradient -->
    <linearGradient id="acc-grad-08" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Reveal Clip Path -->
    <clipPath id="clip-08">
      <rect x="120" y="8" width="500" height="42" class="clip-rect" />
    </clipPath>

    <style>
      .mono-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .sec-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 16.5px;
        font-weight: 800;
        letter-spacing: 1.2px;
        fill: #ffffff;
      }
      .slash-accent {
        fill: #38bdf8;
        font-weight: 900;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #94a3b8;
      }

      /* Dynamic Keyframe Animations */
      .clip-rect {
        animation: textReveal-08 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .text-cursor {
        animation: cursorTrack-08 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .accent-line {
        stroke-dasharray: 135;
        stroke-dashoffset: 0;
        animation: drawAccent-08 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .left-indicator {
        animation: pulseIndicator 4s ease-in-out infinite;
      }
      .divider-filament {
        animation: pulseFilament 4s ease-in-out infinite;
      }
      .status-dot {
        animation: statusBlinkGentle 1.4s ease-in-out infinite;
        will-change: opacity, filter;
      }
      .broadcast-dot {
        animation: signalDotSeq 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: opacity, filter;
      }
      .broadcast-inner {
        animation: signalInnerSeq 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: opacity, filter;
      }
      .broadcast-outer {
        animation: signalOuterSeq 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: opacity, filter;
      }

      @keyframes textReveal-08 {
        0% { width: 0; }
        15% { width: 192px; }
        88% { width: 192px; opacity: 1; }
        96% { width: 192px; opacity: 0.8; }
        100% { width: 0; opacity: 0; }
      }

      @keyframes cursorTrack-08 {
        0% { transform: translateX(0); opacity: 1; }
        15% { transform: translateX(184px); opacity: 1; }
        19%, 27%, 35% { opacity: 0; }
        23%, 31% { opacity: 1; }
        39%, 88% { opacity: 0; transform: translateX(184px); }
        96% { opacity: 0.5; transform: translateX(184px); }
        100% { opacity: 0; transform: translateX(0); }
      }

      @keyframes drawAccent-08 {
        0%, 5% { stroke-dashoffset: 135; opacity: 0; }
        18% { stroke-dashoffset: 0; opacity: 1; }
        88% { stroke-dashoffset: 0; opacity: 0.9; }
        96% { opacity: 0; stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 135; opacity: 0; }
      }

      @keyframes pulseIndicator {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
      }

      @keyframes pulseFilament {
        0%, 100% { stroke: #1e3a5f; }
        50% { stroke: #38bdf8; }
      }

      /* Phase 1: Dot appears (0s - 0.25s), holds through 3.75s, resets (3.75s - 4.0s) */
      @keyframes signalDotSeq {
        0% { opacity: 0; filter: none; }
        6.0% { opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
        89.5% { opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
        95.2% { opacity: 0; filter: none; }
        100% { opacity: 0; filter: none; }
      }

      /* Phase 2: Inner arcs appear (0.25s - 0.55s), hold through 3.55s, reset (3.55s - 3.75s) */
      @keyframes signalInnerSeq {
        0%, 6.0% { opacity: 0; filter: none; }
        13.1% { opacity: 1; filter: drop-shadow(0 0 2.5px #38bdf8); }
        84.5% { opacity: 1; filter: drop-shadow(0 0 2.5px #38bdf8); }
        89.5% { opacity: 0; filter: none; }
        100% { opacity: 0; filter: none; }
      }

      /* Phase 3: Outer arcs appear (0.55s - 0.85s), hold through 3.35s, reset first (3.35s - 3.55s) */
      @keyframes signalOuterSeq {
        0%, 13.1% { opacity: 0; filter: none; }
        20.2% { opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
        79.8% { opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
        84.5% { opacity: 0; filter: none; }
        100% { opacity: 0; filter: none; }
      }

      /* Green Status Indicator: Subtle online breathing (1.4s cycle, never completely dark) */
      @keyframes statusBlinkGentle {
        0%, 100% { opacity: 0.45; filter: drop-shadow(0 0 1px rgba(16, 185, 129, 0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 3.5px #10b981); }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Glass Card Background -->
  <rect x="1" y="1" width="898" height="56" rx="10" fill="url(#sec-bg-08)" stroke="url(#sec-stroke-08)" stroke-width="1.2" />

  <!-- Left Animated Glowing Indicator -->
  <rect class="left-indicator" x="1" y="10" width="4" height="38" rx="2" fill="url(#ind-grad-08)" />

  <!-- Section Number Badge Pill -->
  <g transform="translate(22, 15)">
    <rect width="64" height="28" rx="6" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <text x="32" y="14" text-anchor="middle" dominant-baseline="central" class="mono-badge">◈ 08</text>
  </g>

  <!-- Vertical Divider Filament -->
  <line x1="102" y1="14" x2="102" y2="44" stroke="#1e3a5f" stroke-width="1" class="divider-filament" />
  <circle cx="102" cy="18" r="1.8" fill="#38bdf8" />
  <circle cx="102" cy="40" r="1.8" fill="#0284c7" />

  <!-- Main Section Title with Animated Progressive Reveal -->
  <g clip-path="url(#clip-08)">
    <text class="sec-title" x="120" y="36">CONNECT WITH ME</text>
  </g>

  <!-- Traveling Typing Cursor -->
  <rect class="text-cursor" x="120" y="20" width="2" height="20" rx="1" fill="#38bdf8" />

  <!-- Subtle Animated Underline Accent -->
  <line class="accent-line" x1="120" y1="46" x2="255" y2="46" stroke="url(#acc-grad-08)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Section-Specific Right Visual Marker and Telemetry -->
    <!-- Right Motif: Signal Broadcast Waves & Direct Channel Badge -->
  <g transform="translate(645, 17)">
    <!-- Central Cyan Dot (Phase 1: Reveal 0s - 0.25s, Hold through 3.75s, Fade 3.75s - 4.0s) -->
    <circle cx="20" cy="12" r="2.5" fill="#38bdf8" class="broadcast-dot">
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite"
               values="0; 1; 1; 0; 0"
               keyTimes="0; 0.06; 0.895; 0.952; 1" />
    </circle>

    <!-- Inner Symmetrical Arcs (Phase 2: Reveal 0.25s - 0.55s, Hold through 3.55s, Fade 3.55s - 3.75s) -->
    <path class="broadcast-inner" d="M 14 6 A 8 8 0 0 0 14 18 M 26 6 A 8 8 0 0 1 26 18" stroke="#38bdf8" stroke-width="1.3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite"
               values="0; 0; 1; 1; 0; 0"
               keyTimes="0; 0.06; 0.131; 0.845; 0.895; 1" />
    </path>

    <!-- Outer Symmetrical Arcs (Phase 3: Reveal 0.55s - 0.85s, Hold through 3.35s, Reset First 3.35s - 3.55s) -->
    <path class="broadcast-outer" d="M 9 2 A 14 14 0 0 0 9 22 M 31 2 A 14 14 0 0 1 31 22" stroke="#38bdf8" stroke-width="1.3" fill="none" stroke-linecap="round">
      <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite"
               values="0; 0; 1; 1; 0; 0"
               keyTimes="0; 0.131; 0.202; 0.798; 0.845; 1" />
    </path>

    <line x1="42" y1="12" x2="75" y2="12" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3" />
    <rect x="85" y="0" width="155" height="24" rx="5" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />

    <!-- Green Online Status Indicator (Gentle rhythmic breathing 1.4s cycle, never completely dark) -->
    <circle cx="98" cy="12" r="3.5" fill="#10b981" class="status-dot">
      <animate attributeName="opacity" dur="1.4s" repeatCount="indefinite"
               values="0.45; 1; 0.45"
               keyTimes="0; 0.5; 1" />
    </circle>
    <text x="109" y="12" dominant-baseline="central" class="mono-meta">OPEN FOR INQUIRIES</text>
  </g>
</svg>