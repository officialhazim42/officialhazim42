<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="cg-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.98" />
      <stop offset="60%" stop-color="#0c1833" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.98" />
    </linearGradient>

    <!-- Card Stroke Gradient -->
    <linearGradient id="cg-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.80" />
      <stop offset="35%" stop-color="#3b82f6" stop-opacity="0.40" />
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.60" />
    </linearGradient>

    <!-- Left Accent Gradient -->
    <linearGradient id="ind-grad-cg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="cg-card-glow" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0a1329" stop-opacity="0" />
    </radialGradient>

    <style>
      .cg-card {
        transition: transform 0.25s ease;
      }
      .cg-card:hover .cg-card-bg {
        stroke: #38bdf8;
        stroke-opacity: 0.95;
        filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.45));
      }
      .cg-card:hover .cg-left-accent {
        filter: drop-shadow(0 0 4px #38bdf8);
      }
      .cg-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        letter-spacing: 1px;
      }
      .tag-num {
        font-size: 9.5px;
        font-weight: 700;
        fill: #60a5fa;
      }
      .tag-slash {
        font-size: 9.5px;
        font-weight: 400;
        fill: #334155;
      }
      .tag-label {
        font-size: 10px;
        font-weight: 800;
        fill: #38bdf8;
        letter-spacing: 1.2px;
      }
      .cg-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        fill: #f8fafc;
        letter-spacing: 0.2px;
      }
      .cg-desc {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 10.5px;
        font-weight: 450;
        fill: #94a3b8;
        letter-spacing: 0.15px;
      }

      /* 1. Defense Shield Scanning Animation */
      .shield-scan-beam {
        stroke-dasharray: 12 30;
        animation: shieldScanSeq 3.6s linear infinite;
        will-change: stroke-dashoffset, opacity;
      }
      .shield-base-flare {
        animation: shieldFlareSeq 3.6s ease-in-out infinite;
        will-change: stroke, filter;
      }
      @keyframes shieldScanSeq {
        0% { stroke-dashoffset: 42; opacity: 1; }
        22.2% { stroke-dashoffset: 0; opacity: 1; }
        25.0%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes shieldFlareSeq {
        0%, 16.7% { stroke: #38bdf8; stroke-opacity: 0.7; filter: none; }
        22.2%, 30.6% { stroke: #67e8f9; stroke-opacity: 1; filter: drop-shadow(0 0 3.5px #38bdf8); }
        36.1%, 100% { stroke: #38bdf8; stroke-opacity: 0.7; filter: none; }
      }

      /* 2. Education Learning Guide Animation */
      .edu-doc-body {
        animation: eduDocSeq 3.6s ease-in-out infinite;
        will-change: stroke, filter;
      }
      .edu-line-1 {
        animation: eduLine1Seq 3.6s ease-in-out infinite;
        will-change: stroke, opacity;
      }
      .edu-line-2 {
        animation: eduLine2Seq 3.6s ease-in-out infinite;
        will-change: stroke, opacity;
      }
      .edu-bookmark {
        animation: eduBookmarkSeq 3.6s ease-in-out infinite;
        will-change: stroke, filter;
      }
      @keyframes eduDocSeq {
        0%, 25.0% { stroke: #60a5fa; filter: none; }
        33.3%, 47.2% { stroke: #67e8f9; filter: drop-shadow(0 0 3px #38bdf8); }
        55.6%, 100% { stroke: #60a5fa; filter: none; }
      }
      @keyframes eduLine1Seq {
        0%, 27.8% { stroke: #38bdf8; opacity: 0.5; }
        33.3%, 44.4% { stroke: #a5f3fc; opacity: 1; filter: drop-shadow(0 0 2px #38bdf8); }
        52.8%, 100% { stroke: #38bdf8; opacity: 0.5; filter: none; }
      }
      @keyframes eduLine2Seq {
        0%, 30.6% { stroke: #38bdf8; opacity: 0.5; }
        36.1%, 47.2% { stroke: #a5f3fc; opacity: 1; filter: drop-shadow(0 0 2px #38bdf8); }
        55.6%, 100% { stroke: #38bdf8; opacity: 0.5; filter: none; }
      }
      @keyframes eduBookmarkSeq {
        0%, 25.0% { stroke: #60a5fa; filter: none; }
        36.1%, 47.2% { stroke: #a5f3fc; filter: drop-shadow(0 0 2.5px #38bdf8); }
        55.6%, 100% { stroke: #60a5fa; filter: none; }
      }

      /* 3. Community Activation Animation */
      .comm-center {
        animation: commCenterSeq 3.6s ease-in-out infinite;
        will-change: stroke, filter;
      }
      .comm-peers {
        animation: commPeersSeq 3.6s ease-in-out infinite;
        will-change: stroke, opacity, filter;
      }
      @keyframes commCenterSeq {
        0%, 47.2% { stroke: #22d3ee; filter: none; }
        52.8%, 69.4% { stroke: #67e8f9; filter: drop-shadow(0 0 3.5px #38bdf8); }
        77.8%, 100% { stroke: #22d3ee; filter: none; }
      }
      @keyframes commPeersSeq {
        0%, 52.8% { stroke: #38bdf8; opacity: 0.45; filter: none; }
        58.3%, 69.4% { stroke: #67e8f9; opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
        77.8%, 100% { stroke: #38bdf8; opacity: 0.45; filter: none; }
      }

      /* 4. Ethics Verification Checkmark Animation */
      .ethics-check {
        stroke-dasharray: 16;
        animation: ethicsCheckSeq 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: stroke-dashoffset, stroke, filter;
      }
      @keyframes ethicsCheckSeq {
        0%, 72.2% { stroke-dashoffset: 16; stroke: #38bdf8; filter: none; opacity: 0; }
        75.0% { opacity: 1; }
        83.3% { stroke-dashoffset: 0; stroke: #67e8f9; filter: drop-shadow(0 0 3.5px #38bdf8); opacity: 1; }
        88.9% { stroke-dashoffset: 0; stroke: #a5f3fc; filter: drop-shadow(0 0 4px #38bdf8); }
        94.4%, 100% { stroke-dashoffset: 0; stroke: #38bdf8; filter: none; opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .shield-scan-beam, .shield-base-flare, .edu-doc-body, .edu-line-1, .edu-line-2,
        .edu-bookmark, .comm-center, .comm-peers, .ethics-check {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Pillar 1: 01 / DEFENSE -->
  <g class="cg-card" transform="translate(0, 0)">
    <rect class="cg-card-bg" width="215" height="130" rx="10" fill="url(#cg-card-bg)" stroke="url(#cg-glow)" stroke-width="1.2" />
    <rect class="cg-card-bg" width="215" height="130" rx="10" fill="url(#cg-card-glow)" />
    <rect class="cg-left-accent" x="0" y="8" width="4" height="24" rx="2" fill="url(#ind-grad-cg)" />
    
    <!-- Icon Container -->
    <circle cx="28" cy="28" r="14" fill="#081226" stroke="#1e3a5f" stroke-width="1.1" />
    
    <!-- Shield Security Icon with Sequential Traveling Scan and Flare -->
    <path class="shield-base-flare" d="M 28 21 L 34 23.5 L 34 28 C 34 32 28 35 28 35 C 28 35 22 32 22 28 L 22 23.5 Z" stroke="#38bdf8" stroke-width="1.4" fill="none" stroke-linejoin="round">
      <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
               values="#38bdf8; #38bdf8; #67e8f9; #67e8f9; #38bdf8; #38bdf8"
               keyTimes="0; 0.167; 0.222; 0.306; 0.361; 1" />
    </path>
    <!-- Traveling Cyan Scan Highlight -->
    <path class="shield-scan-beam" d="M 28 21 L 34 23.5 L 34 28 C 34 32 28 35 28 35 C 28 35 22 32 22 28 L 22 23.5 Z" stroke="#67e8f9" stroke-width="1.6" fill="none" stroke-linejoin="round" opacity="0">
      <animate attributeName="stroke-dashoffset" dur="3.6s" repeatCount="indefinite"
               values="42; 0; 0; 0"
               keyTimes="0; 0.222; 0.250; 1" />
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="1; 1; 0; 0"
               keyTimes="0; 0.222; 0.250; 1" />
    </path>

    <text x="48" y="32" class="cg-tag"><tspan class="tag-num">01</tspan><tspan class="tag-slash"> / </tspan><tspan class="tag-label">DEFENSE</tspan></text>
    <text x="16" y="68" class="cg-title">Cyber Awareness</text>
    <text x="16" y="88" class="cg-desc">Phishing resistance, threat</text>
    <text x="16" y="104" class="cg-desc">hygiene &amp; online safety.</text>
  </g>

  <!-- Pillar 2: 02 / EDUCATION -->
  <g class="cg-card" transform="translate(228, 0)">
    <rect class="cg-card-bg" width="215" height="130" rx="10" fill="url(#cg-card-bg)" stroke="url(#cg-glow)" stroke-width="1.2" />
    <rect class="cg-card-bg" width="215" height="130" rx="10" fill="url(#cg-card-glow)" />
    <rect class="cg-left-accent" x="0" y="8" width="4" height="24" rx="2" fill="url(#ind-grad-cg)" />
    
    <!-- Icon Container -->
    <circle cx="28" cy="28" r="14" fill="#081226" stroke="#1e3a5f" stroke-width="1.1" />
    
    <!-- Education Document / Playbook Guide Icon -->
    <path class="edu-doc-body" d="M 23 21 H 32 C 32.6 21 33 21.4 33 22 V 34 C 33 34.6 32.6 35 32 35 H 24 C 23.4 35 23 34.6 23 34 Z" stroke="#60a5fa" stroke-width="1.4" fill="none" stroke-linejoin="round">
      <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
               values="#60a5fa; #60a5fa; #67e8f9; #67e8f9; #60a5fa; #60a5fa"
               keyTimes="0; 0.250; 0.333; 0.472; 0.556; 1" />
    </path>
    <!-- Top Bookmark / Index Tab -->
    <path class="edu-bookmark" d="M 27 21 V 25 L 29 23.5 L 31 25 V 21" stroke="#60a5fa" stroke-width="1.1" fill="none" stroke-linejoin="round">
      <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
               values="#60a5fa; #60a5fa; #a5f3fc; #a5f3fc; #60a5fa; #60a5fa"
               keyTimes="0; 0.250; 0.361; 0.472; 0.556; 1" />
    </path>
    <!-- Content Filaments -->
    <line class="edu-line-1" x1="25" y1="28" x2="31" y2="28" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round">
      <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
               values="#38bdf8; #38bdf8; #a5f3fc; #a5f3fc; #38bdf8; #38bdf8"
               keyTimes="0; 0.278; 0.333; 0.444; 0.528; 1" />
    </line>
    <line class="edu-line-2" x1="25" y1="31" x2="29" y2="31" stroke="#38bdf8" stroke-width="1.1" stroke-linecap="round">
      <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
               values="#38bdf8; #38bdf8; #a5f3fc; #a5f3fc; #38bdf8; #38bdf8"
               keyTimes="0; 0.306; 0.361; 0.472; 0.556; 1" />
    </line>

    <text x="48" y="32" class="cg-tag"><tspan class="tag-num">02</tspan><tspan class="tag-slash"> / </tspan><tspan class="tag-label">EDUCATION</tspan></text>
    <text x="16" y="68" class="cg-title">Digital Safety Guides</text>
    <text x="16" y="88" class="cg-desc">Structured student playbooks</text>
    <text x="16" y="104" class="cg-desc">&amp; interactive PWA manuals.</text>
  </g>

  <!-- Pillar 3: 03 / COMMUNITY -->
  <g class="cg-card" transform="translate(456, 0)">
    <rect class="cg-card-bg" width="215" height="130" rx="10" fill="url(#cg-card-bg)" stroke="url(#cg-glow)" stroke-width="1.2" />
    <rect class="cg-card-bg" width="215" height="130" rx="10" fill="url(#cg-card-glow)" />
    <rect class="cg-left-accent" x="0" y="8" width="4" height="24" rx="2" fill="url(#ind-grad-cg)" />
    
    <!-- Icon Container -->
    <circle cx="28" cy="28" r="14" fill="#081226" stroke="#1e3a5f" stroke-width="1.1" />
    
    <!-- Community Youth Group: Central Leader + Surrounding Peers -->
    <!-- Flanking Peers -->
    <g class="comm-peers">
      <circle cx="21.5" cy="25" r="2.2" stroke="#38bdf8" stroke-width="1.1" fill="none">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
                 values="#38bdf8; #38bdf8; #67e8f9; #67e8f9; #38bdf8; #38bdf8"
                 keyTimes="0; 0.528; 0.583; 0.694; 0.778; 1" />
      </circle>
      <path d="M 18 34 C 18 31.8 19.5 30.5 21.5 30.5" stroke="#38bdf8" stroke-width="1.1" fill="none" stroke-linecap="round">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
                 values="#38bdf8; #38bdf8; #67e8f9; #67e8f9; #38bdf8; #38bdf8"
                 keyTimes="0; 0.528; 0.583; 0.694; 0.778; 1" />
      </path>
      <circle cx="34.5" cy="25" r="2.2" stroke="#38bdf8" stroke-width="1.1" fill="none">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
                 values="#38bdf8; #38bdf8; #67e8f9; #67e8f9; #38bdf8; #38bdf8"
                 keyTimes="0; 0.528; 0.583; 0.694; 0.778; 1" />
      </circle>
      <path d="M 34.5 30.5 C 36.5 30.5 38 31.8 38 34" stroke="#38bdf8" stroke-width="1.1" fill="none" stroke-linecap="round">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
                 values="#38bdf8; #38bdf8; #67e8f9; #67e8f9; #38bdf8; #38bdf8"
                 keyTimes="0; 0.528; 0.583; 0.694; 0.778; 1" />
      </path>
    </g>

    <!-- Central Figure -->
    <g class="comm-center">
      <circle cx="28" cy="24.5" r="3.2" stroke="#22d3ee" stroke-width="1.3" fill="#081226">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
                 values="#22d3ee; #22d3ee; #67e8f9; #67e8f9; #22d3ee; #22d3ee"
                 keyTimes="0; 0.472; 0.528; 0.694; 0.778; 1" />
      </circle>
      <path d="M 23 34 C 23 30.5 25.2 29 28 29 C 30.8 29 33 30.5 33 34" stroke="#22d3ee" stroke-width="1.3" fill="none" stroke-linecap="round">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
                 values="#22d3ee; #22d3ee; #67e8f9; #67e8f9; #22d3ee; #22d3ee"
                 keyTimes="0; 0.472; 0.528; 0.694; 0.778; 1" />
      </path>
    </g>

    <text x="48" y="32" class="cg-tag"><tspan class="tag-num">03</tspan><tspan class="tag-slash"> / </tspan><tspan class="tag-label">COMMUNITY</tspan></text>
    <text x="16" y="68" class="cg-title">Youth Engagement</text>
    <text x="16" y="88" class="cg-desc">Peer workshops, campus</text>
    <text x="16" y="104" class="cg-desc">sessions &amp; literacy talks.</text>
  </g>

  <!-- Pillar 4: 04 / ETHICS -->
  <g class="cg-card" transform="translate(684, 0)">
    <rect class="cg-card-bg" width="215" height="130" rx="10" fill="url(#cg-card-bg)" stroke="url(#cg-glow)" stroke-width="1.2" />
    <rect class="cg-card-bg" width="215" height="130" rx="10" fill="url(#cg-card-glow)" />
    <rect class="cg-left-accent" x="0" y="8" width="4" height="24" rx="2" fill="url(#ind-grad-cg)" />
    
    <!-- Icon Container -->
    <circle cx="28" cy="28" r="14" fill="#081226" stroke="#1e3a5f" stroke-width="1.1" />
    
    <!-- Ethics Checkmark with Progressive Verification Draw and Luminous Flare -->
    <path class="ethics-check" d="M 23 28.5 L 26.5 32 L 33 24" stroke="#38bdf8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dashoffset" dur="3.6s" repeatCount="indefinite"
               values="16; 16; 0; 0; 0"
               keyTimes="0; 0.722; 0.833; 0.944; 1" />
      <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
               values="#38bdf8; #38bdf8; #67e8f9; #a5f3fc; #38bdf8"
               keyTimes="0; 0.722; 0.833; 0.889; 1" />
    </path>

    <text x="48" y="32" class="cg-tag"><tspan class="tag-num">04</tspan><tspan class="tag-slash"> / </tspan><tspan class="tag-label">ETHICS</tspan></text>
    <text x="16" y="68" class="cg-title">Responsible Tech</text>
    <text x="16" y="88" class="cg-desc">Ethical computing, data</text>
    <text x="16" y="104" class="cg-desc">sovereignty &amp; safety habits.</text>
  </g>
</svg>