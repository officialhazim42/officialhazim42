<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <linearGradient id="cg-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b152d" />
      <stop offset="100%" stop-color="#050a16" />
    </linearGradient>
    <linearGradient id="cg-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.3" />
    </linearGradient>
    <style>
      .cg-title { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .cg-desc { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .cg-tag { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- Pillar 1 -->
  <g transform="translate(0, 0)">
    <rect width="215" height="130" rx="10" fill="url(#cg-card-bg)" stroke="url(#cg-glow)" stroke-width="1.2" />
    <rect x="0" y="8" width="4" height="24" rx="2" fill="#38bdf8" />
    <circle cx="28" cy="28" r="14" fill="#0f2244" stroke="#1e3a5f" stroke-width="1" />
    <path d="M 28 21 L 34 23.5 L 34 28 C 34 32 28 35 28 35 C 28 35 22 32 22 28 L 22 23.5 Z" stroke="#38bdf8" stroke-width="1.3" fill="none" />
    <text x="48" y="32" class="cg-tag">01 / DEFENSE</text>
    <text x="16" y="68" class="cg-title">Cyber Awareness</text>
    <text x="16" y="88" class="cg-desc">Phishing resistance, threat</text>
    <text x="16" y="104" class="cg-desc">hygiene &amp; online safety.</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(228, 0)">
    <rect width="215" height="130" rx="10" fill="url(#cg-card-bg)" stroke="url(#cg-glow)" stroke-width="1.2" />
    <rect x="0" y="8" width="4" height="24" rx="2" fill="#3b82f6" />
    <circle cx="28" cy="28" r="14" fill="#0f2244" stroke="#1e3a5f" stroke-width="1" />
    <path d="M 24 24 L 32 24 L 32 32 L 24 32 Z M 28 21 L 28 24" stroke="#60a5fa" stroke-width="1.3" fill="none" />
    <text x="48" y="32" class="cg-tag">02 / EDUCATION</text>
    <text x="16" y="68" class="cg-title">Digital Safety Guides</text>
    <text x="16" y="88" class="cg-desc">Structured student playbooks</text>
    <text x="16" y="104" class="cg-desc">&amp; interactive PWA manuals.</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(456, 0)">
    <rect width="215" height="130" rx="10" fill="url(#cg-card-bg)" stroke="url(#cg-glow)" stroke-width="1.2" />
    <rect x="0" y="8" width="4" height="24" rx="2" fill="#06b6d4" />
    <circle cx="28" cy="28" r="14" fill="#0f2244" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="28" cy="26" r="4" stroke="#22d3ee" stroke-width="1.2" fill="none" />
    <path d="M 21 34 C 21 31 24 29 28 29 C 32 29 35 31 35 34" stroke="#22d3ee" stroke-width="1.2" fill="none" />
    <text x="48" y="32" class="cg-tag">03 / COMMUNITY</text>
    <text x="16" y="68" class="cg-title">Youth Engagement</text>
    <text x="16" y="88" class="cg-desc">Peer workshops, campus</text>
    <text x="16" y="104" class="cg-desc">sessions &amp; literacy talks.</text>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(684, 0)">
    <rect width="215" height="130" rx="10" fill="url(#cg-card-bg)" stroke="url(#cg-glow)" stroke-width="1.2" />
    <rect x="0" y="8" width="4" height="24" rx="2" fill="#38bdf8" />
    <circle cx="28" cy="28" r="14" fill="#0f2244" stroke="#1e3a5f" stroke-width="1" />
    <path d="M 24 28 L 27 31 L 33 24" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <text x="48" y="32" class="cg-tag">04 / ETHICS</text>
    <text x="16" y="68" class="cg-title">Responsible Tech</text>
    <text x="16" y="88" class="cg-desc">Ethical computing, data</text>
    <text x="16" y="104" class="cg-desc">sovereignty &amp; safety habits.</text>
  </g>
</svg>