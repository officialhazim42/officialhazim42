<svg xmlns="http://www.w3.org/2000/svg" width="880" height="68" viewBox="0 0 880 68" fill="none">
  <defs>
    <linearGradient id="hdr-bg-05" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071126" />
      <stop offset="50%" stop-color="#0a193b" />
      <stop offset="100%" stop-color="#060c1d" />
    </linearGradient>
    <linearGradient id="filament-05" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <style>
      @keyframes pulseGlow {
        0%, 100% { r: 5px; opacity: 0.35; }
        50% { r: 8px; opacity: 0.85; }
      }
      @keyframes pulseCore {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }
      .live-glow { animation: pulseGlow 2.2s ease-in-out infinite; }
      .live-core { animation: pulseCore 2.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .live-glow, .live-core { animation: none; }
      }
    </style>
  </defs>

  <!-- Card Header Container -->
  <rect x="0.5" y="0.5" width="879" height="67" rx="8" fill="url(#hdr-bg-05)" stroke="#1e3a5f" stroke-width="1.2" />

  <!-- Top Accent Cyan Filament Line -->
  <rect x="14" y="1" width="260" height="2" rx="1" fill="url(#filament-05)" />

  <!-- Project Number Badge Pill -->
  <rect x="18" y="17" width="76" height="34" rx="6" fill="#081b38" stroke="#0284c7" stroke-width="1.3" />
  <text x="25" y="39" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="800" letter-spacing="1px">05 / 11</text>

  <!-- Project Vector Icon -->
  <g transform="translate(108, 17)">
    <polygon points="12,1 4,12 11,12 10,21 18,10 11,10" stroke="#38bdf8" stroke-width="1.4" fill="#081b38" stroke-linejoin="round"/>
  </g>

  <!-- Project Title -->
  <text x="138" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="0.3px">Advanced Image Compressor</text>

  <!-- Project Tagline -->
  <text x="139" y="51" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1.2px">CLIENT-SIDE MULTI-FORMAT COMPRESSION UTILITY</text>

  <!-- Status Indicator Badge -->
  <g transform="translate(778, 20)">
    <rect width="84" height="28" rx="5" fill="#022c22" stroke="#10b981" stroke-width="1.2" />
    <circle class="live-glow" cx="16" cy="14" r="5" fill="#34d399" />
    <circle class="live-core" cx="16" cy="14" r="3.2" fill="#10b981" />
    <circle cx="16" cy="14" r="1.5" fill="#ecfdf5" />
    <text x="28" y="18.5" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="800" letter-spacing="1px">LIVE</text>
  </g>
</svg>