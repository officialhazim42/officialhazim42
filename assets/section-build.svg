<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 58" width="100%" height="58">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sec-bg-02" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0c1833" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.96" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="sec-stroke-02" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Indicator Accent Gradient -->
    <linearGradient id="ind-grad-02" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Underline Accent Gradient -->
    <linearGradient id="acc-grad-02" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Reveal Clip Path -->
    <clipPath id="clip-02">
      <rect x="120" y="8" width="500" height="42" class="clip-rect" />
    </clipPath>

    <style>
      .mono-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .sec-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 16.5px;
        font-weight: 800;
        letter-spacing: 1.2px;
        fill: #ffffff;
      }
      .slash-accent {
        fill: #38bdf8;
        font-weight: 900;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #94a3b8;
      }

      /* Dynamic Keyframe Animations */
      .clip-rect {
        animation: textReveal-02 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .text-cursor {
        animation: cursorTrack-02 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .accent-line {
        stroke-dasharray: 110;
        stroke-dashoffset: 0;
        animation: drawAccent-02 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .left-indicator {
        animation: pulseIndicator 4s ease-in-out infinite;
      }
      .divider-filament {
        animation: pulseFilament 4s ease-in-out infinite;
      }
      .status-dot {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .waveform-base {
        filter: drop-shadow(0 0 1.5px rgba(56, 189, 248, 0.4));
      }
      .waveform-pulse {
        stroke-dasharray: 20 120;
        animation: waveformGlow 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .waveform-end-dot {
        animation: waveformDotGlow 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes textReveal-02 {
        0% { width: 0; }
        15% { width: 152px; }
        88% { width: 152px; opacity: 1; }
        96% { width: 152px; opacity: 0.8; }
        100% { width: 0; opacity: 0; }
      }

      @keyframes cursorTrack-02 {
        0% { transform: translateX(0); opacity: 1; }
        15% { transform: translateX(144px); opacity: 1; }
        19%, 27%, 35% { opacity: 0; }
        23%, 31% { opacity: 1; }
        39%, 88% { opacity: 0; transform: translateX(144px); }
        96% { opacity: 0.5; transform: translateX(144px); }
        100% { opacity: 0; transform: translateX(0); }
      }

      @keyframes drawAccent-02 {
        0%, 5% { stroke-dashoffset: 110; opacity: 0; }
        18% { stroke-dashoffset: 0; opacity: 1; }
        88% { stroke-dashoffset: 0; opacity: 0.9; }
        96% { opacity: 0; stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 110; opacity: 0; }
      }

      @keyframes pulseIndicator {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
      }

      @keyframes pulseFilament {
        0%, 100% { stroke: #1e3a5f; }
        50% { stroke: #38bdf8; }
      }

      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
      }

      @keyframes waveformGlow {
        0% { stroke-dashoffset: 120; opacity: 0; filter: drop-shadow(0 0 2px #38bdf8); }
        15% { opacity: 0.95; }
        70% { opacity: 0.95; }
        85% { stroke-dashoffset: -20; opacity: 0; filter: drop-shadow(0 0 5px #38bdf8); }
        100% { stroke-dashoffset: -20; opacity: 0; }
      }

      @keyframes waveformDotGlow {
        0%, 65% { opacity: 0.75; filter: drop-shadow(0 0 1px #06b6d4); }
        75%, 85% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
        95%, 100% { opacity: 0.75; filter: drop-shadow(0 0 1px #06b6d4); }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Glass Card Background -->
  <rect x="1" y="1" width="898" height="56" rx="10" fill="url(#sec-bg-02)" stroke="url(#sec-stroke-02)" stroke-width="1.2" />

  <!-- Left Animated Glowing Indicator -->
  <rect class="left-indicator" x="1" y="10" width="4" height="38" rx="2" fill="url(#ind-grad-02)" />

  <!-- Section Number Badge Pill -->
  <g transform="translate(22, 15)">
    <rect width="64" height="28" rx="6" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <text x="32" y="14" text-anchor="middle" dominant-baseline="central" class="mono-badge">◈ 02</text>
  </g>

  <!-- Vertical Divider Filament -->
  <line x1="102" y1="14" x2="102" y2="44" stroke="#1e3a5f" stroke-width="1" class="divider-filament" />
  <circle cx="102" cy="18" r="1.8" fill="#38bdf8" />
  <circle cx="102" cy="40" r="1.8" fill="#0284c7" />

  <!-- Main Section Title with Animated Progressive Reveal -->
  <g clip-path="url(#clip-02)">
    <text class="sec-title" x="120" y="36">WHAT I BUILD</text>
  </g>

  <!-- Traveling Typing Cursor -->
  <rect class="text-cursor" x="120" y="20" width="2" height="20" rx="1" fill="#38bdf8" />

  <!-- Subtle Animated Underline Accent -->
  <line class="accent-line" x1="120" y1="46" x2="230" y2="46" stroke="url(#acc-grad-02)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Section-Specific Right Visual Marker and Telemetry -->
    <!-- Right Motif: Client-Side Compute Waveform & Tech Badge -->
  <g transform="translate(650, 17)">
    <path d="M 0 12 L 25 12 L 31 5 L 39 19 L 47 4 L 55 20 L 61 12 L 85 12" stroke="#38bdf8" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round" class="waveform-base">
      <animate attributeName="d"
        dur="3.2s"
        repeatCount="indefinite"
        values="M 0 12 L 25 12 L 31 5 L 39 19 L 47 4 L 55 20 L 61 12 L 85 12;
                M 0 12 L 25 12 L 31 3 L 39 21 L 47 2 L 55 22 L 61 12 L 85 12;
                M 0 12 L 25 12 L 31 7 L 39 17 L 47 6 L 55 18 L 61 12 L 85 12;
                M 0 12 L 25 12 L 31 5 L 39 19 L 47 4 L 55 20 L 61 12 L 85 12"
        keyTimes="0; 0.35; 0.7; 1"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1" />
    </path>
    <path d="M 0 12 L 25 12 L 31 5 L 39 19 L 47 4 L 55 20 L 61 12 L 85 12" stroke="#38bdf8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" class="waveform-pulse">
      <animate attributeName="d"
        dur="3.2s"
        repeatCount="indefinite"
        values="M 0 12 L 25 12 L 31 5 L 39 19 L 47 4 L 55 20 L 61 12 L 85 12;
                M 0 12 L 25 12 L 31 3 L 39 21 L 47 2 L 55 22 L 61 12 L 85 12;
                M 0 12 L 25 12 L 31 7 L 39 17 L 47 6 L 55 18 L 61 12 L 85 12;
                M 0 12 L 25 12 L 31 5 L 39 19 L 47 4 L 55 20 L 61 12 L 85 12"
        keyTimes="0; 0.35; 0.7; 1"
        calcMode="spline"
        keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1" />
    </path>
    <circle cx="85" cy="12" r="2.5" fill="#06b6d4" class="waveform-end-dot" />
    <rect x="95" y="0" width="140" height="24" rx="5" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="108" cy="12" r="3" fill="#38bdf8" class="status-dot" />
    <text x="119" y="12" dominant-baseline="central" class="mono-meta">IN-BROWSER ENGINE</text>
  </g>
</svg>