<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 176" width="100%" height="176">
  <defs>
    <linearGradient id="ab-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.98" />
      <stop offset="60%" stop-color="#0c1833" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="ab-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#1e3a5f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>
    <radialGradient id="ab-glow" cx="95%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a1329" stop-opacity="0" />
    </radialGradient>

    <!-- Indicator Accent Gradient -->
    <linearGradient id="ind-grad-01" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Underline Accent Gradient -->
    <linearGradient id="acc-grad-01" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Reveal Clip Path for 01 -->
    <clipPath id="clip-01-panel">
      <rect x="120" y="10" width="500" height="36" class="clip-rect-panel" />
    </clipPath>

    <style>
      .mono-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .sec-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 16.5px;
        font-weight: 800;
        letter-spacing: 1.2px;
        fill: #ffffff;
      }
      .slash-accent {
        fill: #38bdf8;
        font-weight: 900;
      }
      .ab-sub {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        fill: #94a3b8;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #94a3b8;
      }
      .ab-p1 { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 500; fill: #f8fafc; }
      .ab-p2 { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 400; fill: #94a3b8; }
      .ab-hi { font-weight: 700; fill: #38bdf8; }
      .ab-hi-w { font-weight: 700; fill: #ffffff; }

      /* Animations */
      .clip-rect-panel {
        animation: textReveal-01 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .text-cursor-panel {
        animation: cursorTrack-01 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .accent-line-panel {
        stroke-dasharray: 140;
        stroke-dashoffset: 0;
        animation: drawAccent-01 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .left-indicator-panel {
        animation: pulseIndicator 4s ease-in-out infinite;
      }
      .status-dot-panel {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .sec1-travel-pulse {
        stroke-dasharray: 8 35;
        animation: sec1Photon 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .sec1-indicator-pulse {
        animation: sec1NodePulse 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes textReveal-01 {
        0% { width: 0; }
        15% { width: 200px; }
        88% { width: 200px; opacity: 1; }
        96% { width: 200px; opacity: 0.8; }
        100% { width: 0; opacity: 0; }
      }

      @keyframes cursorTrack-01 {
        0% { transform: translateX(0); opacity: 1; }
        15% { transform: translateX(194px); opacity: 1; }
        19%, 27%, 35% { opacity: 0; }
        23%, 31% { opacity: 1; }
        39%, 88% { opacity: 0; transform: translateX(194px); }
        96% { opacity: 0.5; transform: translateX(194px); }
        100% { opacity: 0; transform: translateX(0); }
      }

      @keyframes drawAccent-01 {
        0%, 5% { stroke-dashoffset: 140; opacity: 0; }
        18% { stroke-dashoffset: 0; opacity: 1; }
        88% { stroke-dashoffset: 0; opacity: 0.9; }
        96% { opacity: 0; stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 140; opacity: 0; }
      }

      @keyframes pulseIndicator {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
      }

      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
      }

      @keyframes sec1Photon {
        0% { stroke-dashoffset: 35; opacity: 0; }
        15% { opacity: 0.9; }
        50% { stroke-dashoffset: 0; opacity: 0.9; }
        65%, 100% { stroke-dashoffset: -8; opacity: 0; }
      }

      @keyframes sec1NodePulse {
        0%, 45% { opacity: 0.75; filter: drop-shadow(0 0 1px #38bdf8); }
        55%, 65% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
        85%, 100% { opacity: 0.75; filter: drop-shadow(0 0 1px #38bdf8); }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Panel Base -->
  <rect x="1" y="1" width="898" height="174" rx="12" fill="url(#ab-bg)" stroke="url(#ab-stroke)" stroke-width="1.2" />
  <rect x="1" y="1" width="898" height="174" rx="12" fill="url(#ab-glow)" />

  <!-- Left Accent Bar -->
  <rect class="left-indicator-panel" x="1" y="12" width="4" height="48" rx="2" fill="url(#ind-grad-01)" />

  <!-- Section 01 Badge Pill -->
  <g transform="translate(24, 18)">
    <rect width="64" height="28" rx="6" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <text x="32" y="14" text-anchor="middle" dominant-baseline="central" class="mono-badge">◈ 01</text>
  </g>

  <!-- Vertical Divider Filament -->
  <line x1="104" y1="16" x2="104" y2="48" stroke="#1e3a5f" stroke-width="1" />
  <circle cx="104" cy="20" r="1.8" fill="#38bdf8" />
  <circle cx="104" cy="44" r="1.8" fill="#0284c7" />

  <!-- Section Title Block: CREATE \ IDENTITY with Animated Text Reveal -->
  <g clip-path="url(#clip-01-panel)">
    <text class="sec-title" x="122" y="36">CREATE <tspan class="slash-accent">\ </tspan>IDENTITY</text>
  </g>

  <!-- Traveling Typing Cursor -->
  <rect class="text-cursor-panel" x="122" y="20" width="2" height="20" rx="1" fill="#38bdf8" />

  <!-- Animated Accent Underline -->
  <line class="accent-line-panel" x1="122" y1="44" x2="262" y2="44" stroke="url(#acc-grad-01)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Subtitle -->
  <text x="122" y="60" class="ab-sub">Independent Software Creator • Computer Science Engineering Student • Ganderbal, J&amp;K</text>

  <!-- Right Decorative Traces & Active Status Badge -->
  <g transform="translate(685, 20)">
    <line x1="0" y1="12" x2="35" y2="12" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3" />
    <line class="sec1-travel-pulse" x1="0" y1="12" x2="35" y2="12" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" />
    <circle class="sec1-indicator-pulse" cx="35" cy="12" r="2.5" fill="#38bdf8" />
    <rect x="45" y="0" width="155" height="24" rx="5" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="58" cy="12" r="3.5" fill="#10b981" class="status-dot-panel" />
    <text x="70" y="12" dominant-baseline="central" class="mono-meta">DEV.ID // ACTIVE</text>
  </g>

  <!-- Flow Connector with Downward Arrow -->
  <g transform="translate(450, 84)">
    <line x1="-380" y1="0" x2="-20" y2="0" stroke="#1E3A5F" stroke-width="1" />
    <line x1="20" y1="0" x2="410" y2="0" stroke="#1E3A5F" stroke-width="1" />
    <path d="M -8 -4 L 0 4 L 8 -4" stroke="#38bdf8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Integrated Biography Content Container -->
  <g transform="translate(24, 100)">
    <!-- Inner Accent Box -->
    <rect width="852" height="64" rx="8" fill="#0B1730" stroke="#1E3A5F" stroke-width="1" />

    <!-- Paragraph 1 -->
    <text x="18" y="24" class="ab-p1">
      I am a <tspan class="ab-hi">Computer Science Engineering student</tspan> at Government Polytechnic College Ganderbal, Jammu &amp; Kashmir, India,
    </text>
    <text x="18" y="42" class="ab-p1">
      and an independent software creator engineering practical <tspan class="ab-hi-w">client-side web applications</tspan>, Android utilities, and tools.
    </text>

    <!-- Paragraph 2 / Core Focus -->
    <text x="18" y="56" class="ab-p2">
      Focus: <tspan class="ab-hi-w">Zero unnecessary dependencies</tspan> • 100% in-browser privacy • Immediate on-device execution with zero server data collection.
    </text>
  </g>
</svg>