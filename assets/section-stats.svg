<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 58" width="100%" height="58">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sec-bg-07" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0c1833" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.96" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="sec-stroke-07" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Indicator Accent Gradient -->
    <linearGradient id="ind-grad-07" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Underline Accent Gradient -->
    <linearGradient id="acc-grad-07" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Reveal Clip Path -->
    <clipPath id="clip-07">
      <rect x="120" y="8" width="500" height="42" class="clip-rect" />
    </clipPath>

    <style>
      .mono-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .sec-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 16.5px;
        font-weight: 800;
        letter-spacing: 1.2px;
        fill: #ffffff;
      }
      .slash-accent {
        fill: #38bdf8;
        font-weight: 900;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #94a3b8;
      }

      /* Dynamic Keyframe Animations */
      .clip-rect {
        animation: textReveal-07 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .text-cursor {
        animation: cursorTrack-07 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .accent-line {
        stroke-dasharray: 190;
        stroke-dashoffset: 0;
        animation: drawAccent-07 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .left-indicator {
        animation: pulseIndicator 4s ease-in-out infinite;
      }
      .divider-filament {
        animation: pulseFilament 4s ease-in-out infinite;
      }
      .status-dot {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }

      @keyframes textReveal-07 {
        0% { width: 0; }
        15% { width: 302px; }
        88% { width: 302px; opacity: 1; }
        96% { width: 302px; opacity: 0.8; }
        100% { width: 0; opacity: 0; }
      }

      @keyframes cursorTrack-07 {
        0% { transform: translateX(0); opacity: 1; }
        15% { transform: translateX(294px); opacity: 1; }
        19%, 27%, 35% { opacity: 0; }
        23%, 31% { opacity: 1; }
        39%, 88% { opacity: 0; transform: translateX(294px); }
        96% { opacity: 0.5; transform: translateX(294px); }
        100% { opacity: 0; transform: translateX(0); }
      }

      @keyframes drawAccent-07 {
        0%, 5% { stroke-dashoffset: 190; opacity: 0; }
        18% { stroke-dashoffset: 0; opacity: 1; }
        88% { stroke-dashoffset: 0; opacity: 0.9; }
        96% { opacity: 0; stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 190; opacity: 0; }
      }

      @keyframes pulseIndicator {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
      }

      @keyframes pulseFilament {
        0%, 100% { stroke: #1e3a5f; }
        50% { stroke: #38bdf8; }
      }

      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Glass Card Background -->
  <rect x="1" y="1" width="898" height="56" rx="10" fill="url(#sec-bg-07)" stroke="url(#sec-stroke-07)" stroke-width="1.2" />

  <!-- Left Animated Glowing Indicator -->
  <rect class="left-indicator" x="1" y="10" width="4" height="38" rx="2" fill="url(#ind-grad-07)" />

  <!-- Section Number Badge Pill -->
  <g transform="translate(22, 15)">
    <rect width="64" height="28" rx="6" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <text x="32" y="14" text-anchor="middle" dominant-baseline="central" class="mono-badge">◈ 07</text>
  </g>

  <!-- Vertical Divider Filament -->
  <line x1="102" y1="14" x2="102" y2="44" stroke="#1e3a5f" stroke-width="1" class="divider-filament" />
  <circle cx="102" cy="18" r="1.8" fill="#38bdf8" />
  <circle cx="102" cy="40" r="1.8" fill="#0284c7" />

  <!-- Main Section Title with Animated Progressive Reveal -->
  <g clip-path="url(#clip-07)">
    <text class="sec-title" x="120" y="36">GITHUB ACTIVITY AND METRICS</text>
  </g>

  <!-- Traveling Typing Cursor -->
  <rect class="text-cursor" x="120" y="20" width="2" height="20" rx="1" fill="#38bdf8" />

  <!-- Subtle Animated Underline Accent -->
  <line class="accent-line" x1="120" y1="46" x2="310" y2="46" stroke="url(#acc-grad-07)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Section-Specific Right Visual Marker and Telemetry -->
    <!-- Right Motif: Analytical Telemetry Spark Bars -->
  <g transform="translate(640, 17)">
    <rect x="0" y="14" width="3" height="10" rx="1" fill="#1e3a5f" />
    <rect x="6" y="9" width="3" height="15" rx="1" fill="#1d4ed8" />
    <rect x="12" y="5" width="3" height="19" rx="1" fill="#2563eb" />
    <rect x="18" y="11" width="3" height="13" rx="1" fill="#38bdf8" />
    <rect x="24" y="2" width="3" height="22" rx="1" fill="#38bdf8" class="status-dot" />
    <line x1="36" y1="12" x2="75" y2="12" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3" />
    <rect x="85" y="0" width="160" height="24" rx="5" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="98" cy="12" r="3.5" fill="#10b981" class="status-dot" />
    <text x="109" y="12" dominant-baseline="central" class="mono-meta">TELEMETRY // VERIFIED</text>
  </g>
</svg>