<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 168" width="100%" height="168">
  <defs>
    <!-- Background Gradient Matching Profile Glass System -->
    <linearGradient id="ci-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081329" stop-opacity="0.98" />
      <stop offset="50%" stop-color="#0c1b3a" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#060f22" stop-opacity="0.98" />
    </linearGradient>

    <!-- Subtle Clean Stroke Gradient - No Harsh White Edges -->
    <linearGradient id="ci-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#1e3a5f" stop-opacity="0.45" />
      <stop offset="75%" stop-color="#1e293b" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.40" />
    </linearGradient>

    <!-- Soft Radial Ambient Corner Glow -->
    <radialGradient id="ci-glow" cx="14%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      .pulsing-dot {
        animation: pulseDot 2.4s ease-in-out infinite;
      }
      .badge-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.6px;
        fill: #38bdf8;
      }
      .main-heading {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.2px;
        fill: #ffffff;
      }
      .body-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13.5px;
        font-weight: 400;
        fill: #94a3b8;
        letter-spacing: 0.15px;
      }
      .text-highlight {
        font-weight: 600;
        fill: #e2e8f0;
      }
      .text-cyan {
        font-weight: 600;
        fill: #38bdf8;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .pulsing-dot {
          animation: none !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Main Glass Container -->
  <g class="card-root">
    <rect x="1" y="1" width="898" height="166" rx="12" fill="url(#ci-bg)" stroke="url(#ci-stroke)" stroke-width="1" />
    <rect x="1" y="1" width="898" height="166" rx="12" fill="url(#ci-glow)" />

    <!-- Left Accent Glowing Bar -->
    <rect x="1" y="18" width="3.5" height="132" rx="1.75" fill="#38bdf8" opacity="0.9" />

    <!-- Top Status Indicator Pill -->
    <g transform="translate(26, 18)" class="badge-group">
      <rect x="0" y="0" width="268" height="24" rx="12" fill="#09162e" stroke="#1e3a5f" stroke-width="1" />
      <!-- Concentric Halo Glow Rings (Pure Vector - Zero DropShadow Artifacts) -->
      <circle cx="13" cy="12" r="6" fill="#38bdf8" opacity="0.18" />
      <circle cx="13" cy="12" r="3.5" fill="#38bdf8" class="pulsing-dot" />
      <text x="26" y="16.5" class="badge-mono">COLLABORATION &amp; INQUIRIES</text>
    </g>

    <!-- Prominent High-Contrast Section Heading -->
    <g transform="translate(26, 70)" class="heading-group">
      <text x="0" y="0" class="main-heading">Let&#8217;s Build Something Useful &amp; Meaningful Together</text>
    </g>

    <!-- Balanced, Cohesive Supporting Text -->
    <g class="paragraph-group">
      <text x="26" y="100" class="body-text">
        <tspan>I welcome </tspan>
        <tspan class="text-highlight">meaningful connections</tspan>
        <tspan> with developers, creators, open-source maintainers, and engineering teams.</tspan>
      </text>

      <text x="26" y="124" class="body-text">
        <tspan>Whether you want to build an application, </tspan>
        <tspan class="text-cyan">collaborate on open-source software</tspan>
        <tspan>, or exchange technical insights</tspan>
      </text>

      <text x="26" y="148" class="body-text">
        <tspan>around client-side engineering — </tspan>
        <tspan class="text-highlight">feel free to connect across any verified channel below.</tspan>
      </text>
    </g>
  </g>
</svg>