<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 116" width="100%" height="116">
  <defs>
    <linearGradient id="ci-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081329" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0c1b3a" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#071124" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="ci-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#1e3a5f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="ci-glow" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <style>
      .badge-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .body-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13.5px;
        fill: #94a3b8;
        line-height: 1.5;
      }
      .text-bold {
        font-weight: 700;
        fill: #ffffff;
      }
      .text-cyan {
        font-weight: 700;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Main Glass Container -->
  <rect x="1" y="1" width="898" height="114" rx="12" fill="url(#ci-bg)" stroke="url(#ci-stroke)" stroke-width="1.2" />
  <rect x="1" y="1" width="898" height="114" rx="12" fill="url(#ci-glow)" />

  <!-- Left Accent Glowing Bar -->
  <rect x="1" y="24" width="4" height="68" rx="2" fill="#38bdf8" />

  <!-- Top Indicator Pill -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="220" height="22" rx="11" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="12" cy="11" r="3.5" fill="#38bdf8" />
    <text x="24" y="15" class="badge-mono">COLLABORATION &amp; INQUIRIES</text>
  </g>

  <!-- Right Decorative Traces -->
  <g opacity="0.6">
    <circle cx="850" cy="24" r="3" fill="#38bdf8" />
    <line x1="850" y1="24" x2="880" y2="24" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="880" cy="24" r="2" fill="#06b6d4" />
  </g>

  <!-- Introductory Welcoming Statement -->
  <text x="24" y="64" class="body-text">
    <tspan>I welcome </tspan>
    <tspan class="text-bold">meaningful connections</tspan>
    <tspan> with developers, creators, and technology enthusiasts.</tspan>
  </text>
  <text x="24" y="86" class="body-text">
    <tspan>Whether you have an idea to build, an </tspan>
    <tspan class="text-cyan">open-source project to collaborate on</tspan>
    <tspan>, or an opportunity to exchange knowledge</tspan>
  </text>
  <text x="24" y="104" class="body-text">
    <tspan>and explore practical software engineering — </tspan>
    <tspan class="text-bold">feel free to reach out.</tspan>
  </text>
</svg>