<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" width="100%" height="72" style="overflow: visible;">
  <defs>
    <linearGradient id="loc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081329" stop-opacity="0.98" />
      <stop offset="60%" stop-color="#0c1936" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#071022" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="loc-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>
    <style>
      svg { overflow: visible; }
      @keyframes locIn {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pinRadar {
        0% { r: 10; opacity: 0.85; stroke-width: 1.5; }
        100% { r: 23; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes arrowDrift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      @keyframes btnShimmer {
        0%, 100% { stroke-opacity: 0.55; stroke: #1e3a5f; }
        50% { stroke-opacity: 1; stroke: #38bdf8; }
      }
      .loc-card-root {
        animation: locIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .loc-sub {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .loc-main {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15.5px;
        font-weight: 700;
        fill: #ffffff;
      }
      .btn-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #38bdf8;
      }
      .btn-loc-group {
        cursor: pointer;
        transform-origin: 793px 36px;
        transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), filter 0.24s ease;
      }
      .btn-loc-group .loc-rect {
        animation: btnShimmer 3.2s ease-in-out infinite;
        transition: stroke 0.2s ease, stroke-width 0.2s ease;
      }
      .btn-loc-group .loc-arrow {
        animation: arrowDrift 2.4s ease-in-out infinite;
        transition: transform 0.2s ease;
      }
      .btn-loc-group:hover, svg:hover .btn-loc-group {
        transform: translateY(-2px) scale(1.028);
        filter: drop-shadow(0 4px 14px rgba(56, 189, 248, 0.45));
      }
      .btn-loc-group:hover .loc-rect, svg:hover .btn-loc-group .loc-rect {
        stroke: #38bdf8;
        stroke-width: 1.4;
      }
      .btn-loc-group:hover .loc-arrow {
        transform: translateX(4.5px);
      }
      .btn-loc-group:active, svg:active .btn-loc-group {
        transform: translateY(0.5px) scale(0.98);
      }
      .btn-loc-group:focus {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }
      .pin-wave {
        animation: pinRadar 2.5s ease-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .loc-card-root, .btn-loc-group, .loc-arrow, .loc-rect, .pin-wave {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <g class="loc-card-root">
    <rect x="1" y="1" width="898" height="70" rx="10" fill="url(#loc-bg)" stroke="url(#loc-stroke)" stroke-width="1.2" />

    <!-- Left Pin Icon Badge with Animated Radar Ring -->
    <g transform="translate(18, 16)">
      <circle cx="20" cy="20" r="12" fill="none" stroke="#38bdf8" class="pin-wave" />
      <rect x="0" y="0" width="40" height="40" rx="8" fill="#0b1730" stroke="#1e3a5f" stroke-width="1.2" />
      <!-- Pin Icon -->
      <path d="M20 10C16.13 10 13 13.13 13 17C13 22.25 20 29 20 29C20 29 27 22.25 27 17C27 13.13 23.87 10 20 10ZM20 19.5C18.62 19.5 17.5 18.38 17.5 17C17.5 15.62 18.62 14.5 20 14.5C21.38 14.5 22.5 15.62 22.5 17C22.5 18.38 21.38 19.5 20 19.5Z" fill="#38bdf8" />
    </g>

    <!-- Center Text -->
    <g transform="translate(74, 29)">
      <text class="loc-sub">BASE LOCATION &#8226; JAMMU &amp; KASHMIR</text>
      <text y="23" class="loc-main">Ganderbal, Jammu &amp; Kashmir, India</text>
    </g>

    <!-- Right Interactive Direct Action Button -->
    <g transform="translate(710, 19)" class="btn-loc-group" tabindex="0" role="button">
      <rect x="0" y="0" width="166" height="34" rx="7" class="loc-rect" fill="#0b1730" stroke="#1e3a5f" stroke-width="1.2" />
      <g class="loc-arrow" transform="translate(130, 0)">
        <path d="M18 12l4 5-4 5m4-5H10" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9" />
      </g>
      <text x="18" y="21" class="btn-mono">OPEN IN MAPS &#8599;</text>
    </g>
  </g>
</svg>