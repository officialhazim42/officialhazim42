<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 68" width="100%" height="68">
  <defs>
    <linearGradient id="loc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081329" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#0c1936" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#071022" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="loc-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>
    <style>
      .loc-sub {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .loc-main {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        font-weight: 700;
        fill: #ffffff;
      }
      .btn-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <rect x="1" y="1" width="898" height="66" rx="10" fill="url(#loc-bg)" stroke="url(#loc-stroke)" stroke-width="1.2" />

  <!-- Left Pin Icon Badge -->
  <g transform="translate(18, 14)">
    <rect x="0" y="0" width="40" height="40" rx="8" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <!-- Pin Icon -->
    <path d="M20 10C16.13 10 13 13.13 13 17C13 22.25 20 29 20 29C20 29 27 22.25 27 17C27 13.13 23.87 10 20 10ZM20 19.5C18.62 19.5 17.5 18.38 17.5 17C17.5 15.62 18.62 14.5 20 14.5C21.38 14.5 22.5 15.62 22.5 17C22.5 18.38 21.38 19.5 20 19.5Z" fill="#38bdf8" />
  </g>

  <!-- Center Text -->
  <g transform="translate(72, 27)">
    <text class="loc-sub">BASE LOCATION &#8226; JAMMU &amp; KASHMIR</text>
    <text y="22" class="loc-main">Ganderbal, Jammu &amp; Kashmir, India</text>
  </g>

  <!-- Right Clickable Button Representation -->
  <g transform="translate(710, 18)">
    <rect x="0" y="0" width="166" height="32" rx="6" fill="#0b1730" stroke="#38bdf8" stroke-width="1" />
    <path d="M18 11l4 5-4 5m4-5H10" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" transform="translate(130, 0)" />
    <text x="18" y="20" class="btn-mono">OPEN IN MAPS &#8599;</text>
  </g>
</svg>