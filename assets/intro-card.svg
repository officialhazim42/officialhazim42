<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 86" width="100%" height="86">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="intro-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.98" />
      <stop offset="60%" stop-color="#0c1833" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.98" />
    </linearGradient>
    
    <!-- Refined Border Stroke Gradient -->
    <linearGradient id="intro-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Indicator Accent Gradient -->
    <linearGradient id="ind-grad-intro" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Subtle Glow -->
    <radialGradient id="intro-glow" cx="95%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0a1329" stop-opacity="0" />
    </radialGradient>

    <style>
      .lbl {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .val {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        fill: #f8fafc;
        letter-spacing: 0.3px;
      }
      .desc {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 10.5px;
        font-weight: 450;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }

      /* Indicator Accent Pulse */
      .left-indicator-intro {
        animation: pulseIndicatorIntro 4s ease-in-out infinite;
      }
      @keyframes pulseIndicatorIntro {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
      }

      /* 1. Code Brackets Animation: Inward nudge, sweep glow, resting */
      .code-bracket-left {
        animation: codeLeftBracket 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform, stroke, filter;
      }
      .code-bracket-right {
        animation: codeRightBracket 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform, stroke, filter;
      }

      @keyframes codeLeftBracket {
        0%, 100% { transform: translateX(0); stroke: #38bdf8; filter: none; }
        5.6% { transform: translateX(1.5px); stroke: #67e8f9; filter: drop-shadow(0 0 3px #38bdf8); }
        11.1% { transform: translateX(0); stroke: #38bdf8; filter: none; }
        16.7%, 25.0% { stroke: #67e8f9; filter: drop-shadow(0 0 3.5px #38bdf8); }
        34.7% { stroke: #38bdf8; filter: none; }
      }

      @keyframes codeRightBracket {
        0%, 100% { transform: translateX(0); stroke: #38bdf8; filter: none; }
        6.9% { transform: translateX(0); }
        12.5% { transform: translateX(-1.5px); stroke: #67e8f9; filter: drop-shadow(0 0 3px #38bdf8); }
        18.1% { transform: translateX(0); stroke: #38bdf8; filter: none; }
        18.2%, 25.0% { stroke: #67e8f9; filter: drop-shadow(0 0 3.5px #38bdf8); }
        34.7% { stroke: #38bdf8; filter: none; }
      }

      /* 2. Graduation Cap Animation: Gentle lift, upper glint, tassel sway, soft glow */
      .grad-cap-lift {
        animation: gradCapLiftSeq 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform, filter;
      }
      .grad-cap-glint {
        animation: gradCapGlintSeq 3.6s ease-in-out infinite;
        will-change: opacity, filter;
      }
      .grad-cap-tassel {
        transform-origin: 29px 16px;
        animation: gradCapTasselSeq 3.6s ease-in-out infinite;
        will-change: transform;
      }

      @keyframes gradCapLiftSeq {
        0%, 19.4% { transform: translateY(0); filter: none; }
        31.9% { transform: translateY(-2px); filter: drop-shadow(0 0 3px #38bdf8); }
        44.4% { transform: translateY(0); filter: none; }
        50.0%, 56.9% { filter: drop-shadow(0 0 3.5px #38bdf8); }
        65.0%, 100% { transform: translateY(0); filter: none; }
      }

      @keyframes gradCapGlintSeq {
        0%, 25.0% { opacity: 0; filter: none; }
        31.9% { opacity: 1; filter: drop-shadow(0 0 2px #67e8f9); }
        40.0%, 100% { opacity: 0; filter: none; }
      }

      @keyframes gradCapTasselSeq {
        0%, 25.0% { transform: rotate(0deg); }
        35.0% { transform: rotate(3deg); }
        45.0% { transform: rotate(-2deg); }
        55.0%, 100% { transform: rotate(0deg); }
      }

      /* 3. Location Pin Animation: Center point pulse, pin body highlight, radar confirmation */
      .loc-pin-dot {
        animation: locPinDotSeq 3.6s ease-in-out infinite;
        will-change: opacity, fill, filter;
      }
      .loc-pin-body {
        animation: locPinBodySeq 3.6s ease-in-out infinite;
        will-change: stroke, filter;
      }
      .loc-pin-radar {
        animation: locPinRadarSeq 3.6s ease-out infinite;
        will-change: r, opacity;
      }

      @keyframes locPinDotSeq {
        0%, 41.7% { opacity: 0.6; fill: #0284c7; filter: none; }
        48.0%, 65.3% { opacity: 1; fill: #38bdf8; filter: drop-shadow(0 0 3.5px #38bdf8); }
        75.0%, 100% { opacity: 0.6; fill: #0284c7; filter: none; }
      }

      @keyframes locPinBodySeq {
        0%, 50.0% { stroke: #38bdf8; filter: none; }
        56.0%, 68.0% { stroke: #67e8f9; filter: drop-shadow(0 0 3px #38bdf8); }
        78.0%, 100% { stroke: #38bdf8; filter: none; }
      }

      @keyframes locPinRadarSeq {
        0%, 61.1% { r: 2.2px; opacity: 0; }
        63.0% { opacity: 0.85; }
        75.0% { r: 8.5px; opacity: 0; }
        100% { r: 8.5px; opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .code-bracket-left, .code-bracket-right, .grad-cap-lift, .grad-cap-glint, .grad-cap-tassel, .loc-pin-dot, .loc-pin-body, .loc-pin-radar, .left-indicator-intro {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Card Base -->
  <rect x="1" y="1" width="898" height="84" rx="12" fill="url(#intro-bg)" stroke="url(#intro-stroke)" stroke-width="1.2" />
  <rect x="1" y="1" width="898" height="84" rx="12" fill="url(#intro-glow)" />

  <!-- Left Accent Bar -->
  <rect class="left-indicator-intro" x="1" y="12" width="4" height="62" rx="2" fill="url(#ind-grad-intro)" />

  <!-- Pillar 1: Software Creator (Animated Code Brackets) -->
  <g transform="translate(24, 18)">
    <!-- Icon Container -->
    <rect width="36" height="36" rx="8" fill="#081226" stroke="#1e3a5f" stroke-width="1.1" />
    
    <!-- Code Bracket Icon (Left and Right Brackets with Code Activation Motion) -->
    <!-- Left Bracket -->
    <path class="code-bracket-left" d="M 14 13 L 9 18 L 14 23" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animateTransform attributeName="transform" type="translate" dur="3.6s" repeatCount="indefinite"
                        values="0 0; 1.5 0; 0 0; 0 0; 0 0"
                        keyTimes="0; 0.056; 0.111; 0.347; 1" />
      <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
               values="#38bdf8; #67e8f9; #38bdf8; #67e8f9; #38bdf8; #38bdf8"
               keyTimes="0; 0.056; 0.111; 0.250; 0.347; 1" />
    </path>

    <!-- Right Bracket -->
    <path class="code-bracket-right" d="M 22 13 L 27 18 L 22 23" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animateTransform attributeName="transform" type="translate" dur="3.6s" repeatCount="indefinite"
                        values="0 0; 0 0; -1.5 0; 0 0; 0 0"
                        keyTimes="0; 0.069; 0.125; 0.181; 1" />
      <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
               values="#38bdf8; #38bdf8; #67e8f9; #67e8f9; #38bdf8; #38bdf8"
               keyTimes="0; 0.069; 0.125; 0.250; 0.347; 1" />
    </path>
    
    <text x="48" y="14" class="lbl">ROLE &amp; FOCUS</text>
    <text x="48" y="32" class="val">Software Creator</text>
    <text x="48" y="47" class="desc">Web &amp; Android Utilities <tspan fill="#38bdf8">•</tspan> Zero-Upload Privacy</text>
  </g>

  <!-- Divider 1 -->
  <line x1="305" y1="16" x2="305" y2="70" stroke="#1e3a5f" stroke-width="1" />
  <circle cx="305" cy="20" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="305" cy="66" r="1.5" fill="#0284c7" opacity="0.6" />

  <!-- Pillar 2: Academic Base (Animated Graduation Cap) -->
  <g transform="translate(325, 18)">
    <rect width="36" height="36" rx="8" fill="#081226" stroke="#1e3a5f" stroke-width="1.1" />
    
    <!-- Graduation Cap Group with Subtle Lift and Tassel Sway -->
    <g class="grad-cap-lift">
      <animateTransform attributeName="transform" type="translate" dur="3.6s" repeatCount="indefinite"
                        values="0 0; 0 0; 0 -2; 0 0; 0 0"
                        keyTimes="0; 0.194; 0.319; 0.444; 1" />
      <!-- Cap Rhombus Top -->
      <path d="M 7 16 L 18 10 L 29 16 L 18 22 Z" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <!-- Upper Edge Highlight -->
      <path class="grad-cap-glint" d="M 7 16 L 18 10 L 29 16" stroke="#67e8f9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0">
        <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
                 values="0; 0; 1; 0; 0"
                 keyTimes="0; 0.250; 0.319; 0.400; 1" />
      </path>

      <!-- Skull Cap Band -->
      <path d="M 11 19.5 V 25.5 C 11 28 14.5 30.5 18 30.5 S 25 28 25 25.5 V 19.5" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      
      <!-- Gentle Swaying Tassel -->
      <g class="grad-cap-tassel">
        <animateTransform attributeName="transform" type="rotate" dur="3.6s" repeatCount="indefinite"
                          values="0 29 16; 0 29 16; 3 29 16; -2 29 16; 0 29 16; 0 29 16"
                          keyTimes="0; 0.250; 0.350; 0.450; 0.550; 1" />
        <path d="M 29 16 L 30.5 24" stroke="#67e8f9" stroke-width="1.4" stroke-linecap="round" fill="none" />
        <circle cx="30.5" cy="24.5" r="1" fill="#67e8f9" />
      </g>
    </g>
    
    <text x="48" y="14" class="lbl">ACADEMIC BASE</text>
    <text x="48" y="32" class="val">Computer Science Engineering</text>
    <text x="48" y="47" class="desc">Govt Polytechnic College Ganderbal, J&amp;K</text>
  </g>

  <!-- Divider 2 -->
  <line x1="615" y1="16" x2="615" y2="70" stroke="#1e3a5f" stroke-width="1" />
  <circle cx="615" cy="20" r="1.5" fill="#38bdf8" opacity="0.6" />
  <circle cx="615" cy="66" r="1.5" fill="#0284c7" opacity="0.6" />

  <!-- Pillar 3: Location Base (Animated Location Pin with Radar Ping) -->
  <g transform="translate(635, 18)">
    <rect width="36" height="36" rx="8" fill="#081226" stroke="#1e3a5f" stroke-width="1.1" />
    
    <!-- Location Radar Ping Confirmation -->
    <circle class="loc-pin-radar" cx="18" cy="16" r="2.2" fill="none" stroke="#67e8f9" stroke-width="1.2" opacity="0">
      <animate attributeName="r" dur="3.6s" repeatCount="indefinite"
               values="2.2; 2.2; 8.5; 8.5"
               keyTimes="0; 0.611; 0.750; 1" />
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 0; 0.85; 0; 0"
               keyTimes="0; 0.611; 0.630; 0.750; 1" />
    </circle>

    <!-- Location Pin Body -->
    <path class="loc-pin-body" d="M 18 10 C 14.7 10 12 12.7 12 16 C 12 20.5 18 27 18 27 S 24 20.5 24 16 C 24 12.7 21.3 10 18 10 Z" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
               values="#38bdf8; #38bdf8; #67e8f9; #38bdf8; #38bdf8"
               keyTimes="0; 0.528; 0.653; 0.780; 1" />
    </path>

    <!-- Central Point Pulse -->
    <circle class="loc-pin-dot" cx="18" cy="16" r="2.2" fill="#38bdf8">
      <animate attributeName="fill" dur="3.6s" repeatCount="indefinite"
               values="#0284c7; #0284c7; #38bdf8; #0284c7; #0284c7"
               keyTimes="0; 0.417; 0.528; 0.750; 1" />
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0.6; 0.6; 1; 0.6; 0.6"
               keyTimes="0; 0.417; 0.528; 0.750; 1" />
    </circle>
    
    <text x="48" y="14" class="lbl">LOCATION</text>
    <text x="48" y="32" class="val">Ganderbal, Kashmir</text>
    <text x="48" y="47" class="desc">Jammu &amp; Kashmir, India</text>
  </g>
</svg>