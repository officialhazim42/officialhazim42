<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 800 50'
    style='background-color: #00000000;'
    width='800px' height='50px'>

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>
    <!-- Cohesive Glassmorphism Terminal Card -->
    <rect x="2" y="2" width="796" height="46" rx="10" fill="#081224" fill-opacity="0.8" stroke="#1e3a5f" stroke-width="1.2" />
    <line x1="30" y1="2" x2="160" y2="2" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="20" cy="25" r="4" fill="#10b981" />
    <text x="32" y="30" fill="#64748b" font-size="13" font-family="monospace" font-weight="700">&gt;</text>
  

                    <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d3.end'
                    dur='6400ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h800 ; m0,25 h800 ; m0,25 h0' keyTimes='0;0.625;0.84375;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#38BDF8' font-size='16'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Building useful digital products and accessible technology
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='6400ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h800 ; m0,25 h800 ; m0,25 h0' keyTimes='0;0.625;0.84375;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#38BDF8' font-size='16'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Web &amp; Android Development | Client-Side Utilities
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='6400ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h800 ; m0,25 h800 ; m0,25 h0' keyTimes='0;0.625;0.84375;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#38BDF8' font-size='16'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Youth Cyber Defense Education | CyberGuard YUVA
        </textPath>
    </text>
        <path id='path3'>
                            <!-- Single line -->
                                <animate id='d3' attributeName='d' begin='d2.end'
                    dur='6400ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h800 ; m0,25 h800 ; m0,25 h0' keyTimes='0;0.625;0.84375;1' />
                    </path>
    <text font-family='"Fira Code", monospace' fill='#38BDF8' font-size='16'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path3'>
            Computer Science Engineering Student &amp; Software Creator
        </textPath>
    </text>
</svg>
