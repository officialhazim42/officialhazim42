<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 58" width="100%" height="58">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sec-bg-06" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0c1833" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.96" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="sec-stroke-06" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Indicator Accent Gradient -->
    <linearGradient id="ind-grad-06" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Underline Accent Gradient -->
    <linearGradient id="acc-grad-06" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Reveal Clip Path -->
    <clipPath id="clip-06">
      <rect x="120" y="8" width="500" height="42" class="clip-rect" />
    </clipPath>

    <style>
      .mono-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .sec-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 16.5px;
        font-weight: 800;
        letter-spacing: 1.2px;
        fill: #ffffff;
      }
      .slash-accent {
        fill: #38bdf8;
        font-weight: 900;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #94a3b8;
      }
      .stage-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 6.5px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      /* Dynamic Keyframe Animations */
      .clip-rect {
        animation: textReveal-06 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .text-cursor {
        animation: cursorTrack-06 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .accent-line {
        stroke-dasharray: 170;
        stroke-dashoffset: 0;
        animation: drawAccent-06 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .left-indicator {
        animation: pulseIndicator 4s ease-in-out infinite;
      }
      .divider-filament {
        animation: pulseFilament 4s ease-in-out infinite;
      }

      @keyframes textReveal-06 {
        0% { width: 0; }
        15% { width: 252px; }
        88% { width: 252px; opacity: 1; }
        96% { width: 252px; opacity: 0.8; }
        100% { width: 0; opacity: 0; }
      }

      @keyframes cursorTrack-06 {
        0% { transform: translateX(0); opacity: 1; }
        15% { transform: translateX(244px); opacity: 1; }
        19%, 27%, 35% { opacity: 0; }
        23%, 31% { opacity: 1; }
        39%, 88% { opacity: 0; transform: translateX(244px); }
        96% { opacity: 0.5; transform: translateX(244px); }
        100% { opacity: 0; transform: translateX(0); }
      }

      @keyframes drawAccent-06 {
        0%, 5% { stroke-dashoffset: 170; opacity: 0; }
        18% { stroke-dashoffset: 0; opacity: 1; }
        88% { stroke-dashoffset: 0; opacity: 0.9; }
        96% { opacity: 0; stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 170; opacity: 0; }
      }

      @keyframes pulseIndicator {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
      }

      @keyframes pulseFilament {
        0%, 100% { stroke: #1e3a5f; }
        50% { stroke: #38bdf8; }
      }

      /* -------------------------------------------------------------
         Development Journey Progress Tracker Animations (3.6s Cycle)
         ------------------------------------------------------------- */
      /* Active Progressive Connecting Line Track */
      .journey-track-active {
        stroke-dasharray: 72;
        animation: journeyTrackProgress 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: stroke-dashoffset, opacity;
      }
      @keyframes journeyTrackProgress {
        0% { stroke-dashoffset: 72; opacity: 1; }
        8.3% { stroke-dashoffset: 72; opacity: 1; }
        19.4% { stroke-dashoffset: 48; opacity: 1; }
        27.8% { stroke-dashoffset: 48; opacity: 1; }
        38.9% { stroke-dashoffset: 24; opacity: 1; }
        47.2% { stroke-dashoffset: 24; opacity: 1; }
        58.3% { stroke-dashoffset: 0; opacity: 1; }
        83.3% { stroke-dashoffset: 0; opacity: 1; filter: drop-shadow(0 0 2px #38bdf8); }
        94.4%, 100% { stroke-dashoffset: 0; opacity: 0; filter: none; }
      }

      /* Traveling Luminous Signal Pulse Bead */
      .journey-signal-pulse {
        animation: journeySignalTravel 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform, opacity;
      }
      @keyframes journeySignalTravel {
        0% { transform: translateX(0); opacity: 0; }
        8.3% { transform: translateX(0); opacity: 1; }
        19.4% { transform: translateX(24px); opacity: 1; }
        27.8% { transform: translateX(24px); opacity: 0.85; }
        38.9% { transform: translateX(48px); opacity: 1; }
        47.2% { transform: translateX(48px); opacity: 0.85; }
        58.3% { transform: translateX(72px); opacity: 1; }
        66.7% { transform: translateX(72px); opacity: 1; filter: drop-shadow(0 0 3px #67e8f9); }
        72.2%, 100% { transform: translateX(72px); opacity: 0; }
      }

      /* Milestone 1: FOUNDATION (x=8) */
      .ms-out-1 {
        animation: msOut1Seq 3.6s ease-in-out infinite;
        will-change: stroke, filter;
      }
      .ms-in-1 {
        animation: msIn1Seq 3.6s ease-in-out infinite;
        will-change: fill;
      }
      .ms-tag-1 {
        animation: msTag1Seq 3.6s ease-in-out infinite;
        will-change: fill;
      }
      @keyframes msOut1Seq {
        0% { stroke: #67e8f9; filter: drop-shadow(0 0 3px #38bdf8); }
        8.3% { stroke: #67e8f9; filter: drop-shadow(0 0 3.5px #38bdf8); }
        19.4%, 66.7% { stroke: #38bdf8; filter: drop-shadow(0 0 1.5px #38bdf8); }
        72.2%, 83.3% { stroke: #67e8f9; filter: drop-shadow(0 0 3.5px #38bdf8); }
        94.4%, 100% { stroke: #1e3a5f; filter: none; }
      }
      @keyframes msIn1Seq {
        0%, 8.3% { fill: #a5f3fc; }
        19.4%, 66.7% { fill: #38bdf8; }
        72.2%, 83.3% { fill: #a5f3fc; }
        94.4%, 100% { fill: #1e293b; }
      }
      @keyframes msTag1Seq {
        0%, 8.3% { fill: #67e8f9; }
        19.4%, 66.7% { fill: #38bdf8; }
        72.2%, 83.3% { fill: #67e8f9; }
        94.4%, 100% { fill: #475569; }
      }

      /* Milestone 2: BUILD (x=32) */
      .ms-out-2 {
        animation: msOut2Seq 3.6s ease-in-out infinite;
        will-change: stroke, filter;
      }
      .ms-in-2 {
        animation: msIn2Seq 3.6s ease-in-out infinite;
        will-change: fill;
      }
      .ms-tag-2 {
        animation: msTag2Seq 3.6s ease-in-out infinite;
        will-change: fill;
      }
      @keyframes msOut2Seq {
        0%, 16.7% { stroke: #1e3a5f; filter: none; }
        19.4%, 27.8% { stroke: #67e8f9; filter: drop-shadow(0 0 3.5px #38bdf8); }
        38.9%, 66.7% { stroke: #38bdf8; filter: drop-shadow(0 0 1.5px #38bdf8); }
        72.2%, 83.3% { stroke: #67e8f9; filter: drop-shadow(0 0 3.5px #38bdf8); }
        94.4%, 100% { stroke: #1e3a5f; filter: none; }
      }
      @keyframes msIn2Seq {
        0%, 16.7% { fill: #1e293b; }
        19.4%, 27.8% { fill: #a5f3fc; }
        38.9%, 66.7% { fill: #38bdf8; }
        72.2%, 83.3% { fill: #a5f3fc; }
        94.4%, 100% { fill: #1e293b; }
      }
      @keyframes msTag2Seq {
        0%, 16.7% { fill: #475569; }
        19.4%, 27.8% { fill: #67e8f9; }
        38.9%, 66.7% { fill: #38bdf8; }
        72.2%, 83.3% { fill: #67e8f9; }
        94.4%, 100% { fill: #475569; }
      }

      /* Milestone 3: EXPLORE (x=56) */
      .ms-out-3 {
        animation: msOut3Seq 3.6s ease-in-out infinite;
        will-change: stroke, filter;
      }
      .ms-in-3 {
        animation: msIn3Seq 3.6s ease-in-out infinite;
        will-change: fill;
      }
      .ms-tag-3 {
        animation: msTag3Seq 3.6s ease-in-out infinite;
        will-change: fill;
      }
      @keyframes msOut3Seq {
        0%, 36.1% { stroke: #1e3a5f; filter: none; }
        38.9%, 47.2% { stroke: #67e8f9; filter: drop-shadow(0 0 3.5px #38bdf8); }
        58.3%, 66.7% { stroke: #38bdf8; filter: drop-shadow(0 0 1.5px #38bdf8); }
        72.2%, 83.3% { stroke: #67e8f9; filter: drop-shadow(0 0 3.5px #38bdf8); }
        94.4%, 100% { stroke: #1e3a5f; filter: none; }
      }
      @keyframes msIn3Seq {
        0%, 36.1% { fill: #1e293b; }
        38.9%, 47.2% { fill: #a5f3fc; }
        58.3%, 66.7% { fill: #38bdf8; }
        72.2%, 83.3% { fill: #a5f3fc; }
        94.4%, 100% { fill: #1e293b; }
      }
      @keyframes msTag3Seq {
        0%, 36.1% { fill: #475569; }
        38.9%, 47.2% { fill: #67e8f9; }
        58.3%, 66.7% { fill: #38bdf8; }
        72.2%, 83.3% { fill: #67e8f9; }
        94.4%, 100% { fill: #475569; }
      }

      /* Milestone 4: EVOLVE (x=80) */
      .ms-out-4 {
        animation: msOut4Seq 3.6s ease-in-out infinite;
        will-change: stroke, filter;
      }
      .ms-in-4 {
        animation: msIn4Seq 3.6s ease-in-out infinite;
        will-change: fill;
      }
      .ms-tag-4 {
        animation: msTag4Seq 3.6s ease-in-out infinite;
        will-change: fill;
      }
      @keyframes msOut4Seq {
        0%, 55.6% { stroke: #1e3a5f; filter: none; }
        58.3%, 66.7% { stroke: #67e8f9; filter: drop-shadow(0 0 4px #38bdf8); }
        72.2%, 83.3% { stroke: #67e8f9; filter: drop-shadow(0 0 4px #38bdf8); }
        94.4%, 100% { stroke: #1e3a5f; filter: none; }
      }
      @keyframes msIn4Seq {
        0%, 55.6% { fill: #1e293b; }
        58.3%, 66.7% { fill: #a5f3fc; }
        72.2%, 83.3% { fill: #a5f3fc; }
        94.4%, 100% { fill: #1e293b; }
      }
      @keyframes msTag4Seq {
        0%, 55.6% { fill: #475569; }
        58.3%, 66.7% { fill: #67e8f9; }
        72.2%, 83.3% { fill: #67e8f9; }
        94.4%, 100% { fill: #475569; }
      }

      @media (prefers-reduced-motion: reduce) {
        .journey-track-active, .journey-signal-pulse,
        .ms-out-1, .ms-in-1, .ms-tag-1,
        .ms-out-2, .ms-in-2, .ms-tag-2,
        .ms-out-3, .ms-in-3, .ms-tag-3,
        .ms-out-4, .ms-in-4, .ms-tag-4 {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <!-- Glass Card Background -->
  <rect x="1" y="1" width="898" height="56" rx="10" fill="url(#sec-bg-06)" stroke="url(#sec-stroke-06)" stroke-width="1.2" />

  <!-- Left Animated Glowing Indicator -->
  <rect class="left-indicator" x="1" y="10" width="4" height="38" rx="2" fill="url(#ind-grad-06)" />

  <!-- Section Number Badge Pill -->
  <g transform="translate(22, 15)">
    <rect width="64" height="28" rx="6" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <text x="32" y="14" text-anchor="middle" dominant-baseline="central" class="mono-badge">◈ 06</text>
  </g>

  <!-- Vertical Divider Filament -->
  <line x1="102" y1="14" x2="102" y2="44" stroke="#1e3a5f" stroke-width="1" class="divider-filament" />
  <circle cx="102" cy="18" r="1.8" fill="#38bdf8" />
  <circle cx="102" cy="40" r="1.8" fill="#0284c7" />

  <!-- Main Section Title with Animated Progressive Reveal -->
  <g clip-path="url(#clip-06)">
    <text class="sec-title" x="120" y="36">DEVELOPMENT JOURNEY</text>
  </g>

  <!-- Traveling Typing Cursor -->
  <rect class="text-cursor" x="120" y="20" width="2" height="20" rx="1" fill="#38bdf8" />

  <!-- Subtle Animated Underline Accent -->
  <line class="accent-line" x1="120" y1="46" x2="290" y2="46" stroke="url(#acc-grad-06)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Section-Specific Right Visual Marker and Telemetry -->
  <!-- Development Progress Tracker (4 Sequential Milestones) + Preserved PROGRESS TRACK Badge -->
  <g transform="translate(650, 17)">
    <!-- Base Dormant Pipeline Track -->
    <line x1="8" y1="12" x2="80" y2="12" stroke="#1e3a5f" stroke-width="1.4" stroke-linecap="round" />
    
    <!-- Active Illuminated Progressive Track -->
    <line class="journey-track-active" x1="8" y1="12" x2="80" y2="12" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" dur="3.6s" repeatCount="indefinite"
               values="72; 72; 48; 48; 24; 24; 0; 0; 0"
               keyTimes="0; 0.083; 0.194; 0.278; 0.389; 0.472; 0.583; 0.833; 1" />
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="1; 1; 1; 1; 1; 1; 1; 1; 0"
               keyTimes="0; 0.083; 0.194; 0.278; 0.389; 0.472; 0.583; 0.833; 1" />
    </line>

    <!-- Traveling Luminous Signal Pulse Bead -->
    <circle class="journey-signal-pulse" cx="8" cy="12" r="2.2" fill="#a5f3fc">
      <animateTransform attributeName="transform" type="translate" dur="3.6s" repeatCount="indefinite"
                        values="0 0; 0 0; 24 0; 24 0; 48 0; 48 0; 72 0; 72 0; 72 0"
                        keyTimes="0; 0.083; 0.194; 0.278; 0.389; 0.472; 0.583; 0.667; 1" />
      <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite"
               values="0; 1; 1; 0.85; 1; 0.85; 1; 1; 0"
               keyTimes="0; 0.083; 0.194; 0.278; 0.389; 0.472; 0.583; 0.667; 1" />
    </circle>

    <!-- Milestone 1: 01 / FOUNDATION -->
    <g class="milestone-1">
      <title>01 — FOUNDATION</title>
      <circle class="ms-out-1" cx="8" cy="12" r="3.6" fill="#081226" stroke="#1e3a5f" stroke-width="1.2">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
                 values="#67e8f9; #67e8f9; #38bdf8; #67e8f9; #1e3a5f"
                 keyTimes="0; 0.083; 0.194; 0.833; 1" />
      </circle>
      <circle class="ms-in-1" cx="8" cy="12" r="1.8" fill="#1e293b">
        <animate attributeName="fill" dur="3.6s" repeatCount="indefinite"
                 values="#a5f3fc; #a5f3fc; #38bdf8; #a5f3fc; #1e293b"
                 keyTimes="0; 0.083; 0.194; 0.833; 1" />
      </circle>
      <text x="8" y="22" text-anchor="middle" class="stage-tag ms-tag-1" fill="#475569">01</text>
    </g>

    <!-- Milestone 2: 02 / BUILD -->
    <g class="milestone-2">
      <title>02 — BUILD</title>
      <circle class="ms-out-2" cx="32" cy="12" r="3.6" fill="#081226" stroke="#1e3a5f" stroke-width="1.2">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
                 values="#1e3a5f; #1e3a5f; #67e8f9; #38bdf8; #67e8f9; #1e3a5f"
                 keyTimes="0; 0.167; 0.194; 0.389; 0.833; 1" />
      </circle>
      <circle class="ms-in-2" cx="32" cy="12" r="1.8" fill="#1e293b">
        <animate attributeName="fill" dur="3.6s" repeatCount="indefinite"
                 values="#1e293b; #1e293b; #a5f3fc; #38bdf8; #a5f3fc; #1e293b"
                 keyTimes="0; 0.167; 0.194; 0.389; 0.833; 1" />
      </circle>
      <text x="32" y="22" text-anchor="middle" class="stage-tag ms-tag-2" fill="#475569">02</text>
    </g>

    <!-- Milestone 3: 03 / EXPLORE -->
    <g class="milestone-3">
      <title>03 — EXPLORE</title>
      <circle class="ms-out-3" cx="56" cy="12" r="3.6" fill="#081226" stroke="#1e3a5f" stroke-width="1.2">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
                 values="#1e3a5f; #1e3a5f; #67e8f9; #38bdf8; #67e8f9; #1e3a5f"
                 keyTimes="0; 0.361; 0.389; 0.583; 0.833; 1" />
      </circle>
      <circle class="ms-in-3" cx="56" cy="12" r="1.8" fill="#1e293b">
        <animate attributeName="fill" dur="3.6s" repeatCount="indefinite"
                 values="#1e293b; #1e293b; #a5f3fc; #38bdf8; #a5f3fc; #1e293b"
                 keyTimes="0; 0.361; 0.389; 0.583; 0.833; 1" />
      </circle>
      <text x="56" y="22" text-anchor="middle" class="stage-tag ms-tag-3" fill="#475569">03</text>
    </g>

    <!-- Milestone 4: 04 / EVOLVE -->
    <g class="milestone-4">
      <title>04 — EVOLVE</title>
      <circle class="ms-out-4" cx="80" cy="12" r="3.6" fill="#081226" stroke="#1e3a5f" stroke-width="1.2">
        <animate attributeName="stroke" dur="3.6s" repeatCount="indefinite"
                 values="#1e3a5f; #1e3a5f; #67e8f9; #67e8f9; #1e3a5f"
                 keyTimes="0; 0.556; 0.583; 0.833; 1" />
      </circle>
      <circle class="ms-in-4" cx="80" cy="12" r="1.8" fill="#1e293b">
        <animate attributeName="fill" dur="3.6s" repeatCount="indefinite"
                 values="#1e293b; #1e293b; #a5f3fc; #a5f3fc; #1e293b"
                 keyTimes="0; 0.556; 0.583; 0.833; 1" />
      </circle>
      <text x="80" y="22" text-anchor="middle" class="stage-tag ms-tag-4" fill="#475569">04</text>
    </g>

    <!-- Preserved PROGRESS TRACK Badge (Completely Unaltered Dimensions & Content) -->
    <rect x="90" y="0" width="145" height="24" rx="5" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <text x="162" y="12" text-anchor="middle" dominant-baseline="central" class="mono-meta">PROGRESS TRACK</text>
  </g>
</svg>