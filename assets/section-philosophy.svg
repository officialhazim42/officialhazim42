<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 58" width="100%" height="58">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="sec-bg-06" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0c1833" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.96" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="sec-stroke-06" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#1e3a5f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>

    <!-- Indicator Accent Gradient -->
    <linearGradient id="ind-grad-06" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Underline Accent Gradient -->
    <linearGradient id="acc-grad-06" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Text Reveal Clip Path -->
    <clipPath id="clip-06">
      <rect x="120" y="8" width="500" height="42" class="clip-rect" />
    </clipPath>

    <style>
      .mono-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #38bdf8;
      }
      .sec-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
        font-size: 16.5px;
        font-weight: 800;
        letter-spacing: 1.2px;
        fill: #ffffff;
      }
      .slash-accent {
        fill: #38bdf8;
        font-weight: 900;
      }
      .mono-meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 1px;
        fill: #94a3b8;
      }

      /* Dynamic Keyframe Animations */
      .clip-rect {
        animation: textReveal-06 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .text-cursor {
        animation: cursorTrack-06 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .accent-line {
        stroke-dasharray: 170;
        stroke-dashoffset: 0;
        animation: drawAccent-06 8.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }
      .left-indicator {
        animation: pulseIndicator 4s ease-in-out infinite;
      }
      .divider-filament {
        animation: pulseFilament 4s ease-in-out infinite;
      }
      .status-dot {
        animation: pulseGlow 2.5s ease-in-out infinite;
      }
      .journey-runner {
        stroke-dasharray: 8 60;
        animation: journeyTrack 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .journey-node-1 {
        animation: journeyNode1 3.6s ease-in-out infinite;
      }
      .journey-node-2 {
        animation: journeyNode2 3.6s ease-in-out infinite;
      }
      .journey-node-3 {
        animation: journeyNode3 3.6s ease-in-out infinite;
      }

      @keyframes textReveal-06 {
        0% { width: 0; }
        15% { width: 252px; }
        88% { width: 252px; opacity: 1; }
        96% { width: 252px; opacity: 0.8; }
        100% { width: 0; opacity: 0; }
      }

      @keyframes cursorTrack-06 {
        0% { transform: translateX(0); opacity: 1; }
        15% { transform: translateX(244px); opacity: 1; }
        19%, 27%, 35% { opacity: 0; }
        23%, 31% { opacity: 1; }
        39%, 88% { opacity: 0; transform: translateX(244px); }
        96% { opacity: 0.5; transform: translateX(244px); }
        100% { opacity: 0; transform: translateX(0); }
      }

      @keyframes drawAccent-06 {
        0%, 5% { stroke-dashoffset: 170; opacity: 0; }
        18% { stroke-dashoffset: 0; opacity: 1; }
        88% { stroke-dashoffset: 0; opacity: 0.9; }
        96% { opacity: 0; stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 170; opacity: 0; }
      }

      @keyframes pulseIndicator {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
      }

      @keyframes pulseFilament {
        0%, 100% { stroke: #1e3a5f; }
        50% { stroke: #38bdf8; }
      }

      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 3px #38bdf8); }
      }

      @keyframes journeyTrack {
        0% { stroke-dashoffset: 60; opacity: 0; }
        10% { opacity: 0.95; }
        70% { stroke-dashoffset: 0; opacity: 0.95; }
        82%, 100% { stroke-dashoffset: -8; opacity: 0; }
      }

      @keyframes journeyNode1 {
        0%, 100% { fill: #1e293b; stroke: #334155; filter: none; }
        10%, 25% { fill: #0284c7; stroke: #38bdf8; filter: drop-shadow(0 0 3px #38bdf8); }
        35% { fill: #1e293b; stroke: #334155; filter: none; }
      }

      @keyframes journeyNode2 {
        0%, 30% { fill: #3b82f6; opacity: 0.8; filter: none; }
        42%, 55% { fill: #38bdf8; opacity: 1; filter: drop-shadow(0 0 3.5px #38bdf8); }
        68%, 100% { fill: #3b82f6; opacity: 0.8; filter: none; }
      }

      @keyframes journeyNode3 {
        0%, 65% { fill: #38bdf8; opacity: 0.8; filter: drop-shadow(0 0 1px #38bdf8); }
        75%, 88% { fill: #7dd3fc; opacity: 1; filter: drop-shadow(0 0 5px #38bdf8); }
        98%, 100% { fill: #38bdf8; opacity: 0.8; filter: drop-shadow(0 0 1px #38bdf8); }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
        }
      }
    </style>
  </defs>

  <!-- Glass Card Background -->
  <rect x="1" y="1" width="898" height="56" rx="10" fill="url(#sec-bg-06)" stroke="url(#sec-stroke-06)" stroke-width="1.2" />

  <!-- Left Animated Glowing Indicator -->
  <rect class="left-indicator" x="1" y="10" width="4" height="38" rx="2" fill="url(#ind-grad-06)" />

  <!-- Section Number Badge Pill -->
  <g transform="translate(22, 15)">
    <rect width="64" height="28" rx="6" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <text x="32" y="14" text-anchor="middle" dominant-baseline="central" class="mono-badge">◈ 06</text>
  </g>

  <!-- Vertical Divider Filament -->
  <line x1="102" y1="14" x2="102" y2="44" stroke="#1e3a5f" stroke-width="1" class="divider-filament" />
  <circle cx="102" cy="18" r="1.8" fill="#38bdf8" />
  <circle cx="102" cy="40" r="1.8" fill="#0284c7" />

  <!-- Main Section Title with Animated Progressive Reveal -->
  <g clip-path="url(#clip-06)">
    <text class="sec-title" x="120" y="36">DEVELOPMENT JOURNEY</text>
  </g>

  <!-- Traveling Typing Cursor -->
  <rect class="text-cursor" x="120" y="20" width="2" height="20" rx="1" fill="#38bdf8" />

  <!-- Subtle Animated Underline Accent -->
  <line class="accent-line" x1="120" y1="46" x2="290" y2="46" stroke="url(#acc-grad-06)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Section-Specific Right Visual Marker and Telemetry -->
    <!-- Right Motif: Growth Track Waypoint Progress Line -->
  <g transform="translate(650, 17)">
    <line x1="0" y1="12" x2="80" y2="12" stroke="#1e3a5f" stroke-width="1.5" />
    <line class="journey-runner" x1="15" y1="12" x2="75" y2="12" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" />
    <circle class="journey-node-1" cx="15" cy="12" r="3" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle class="journey-node-2" cx="45" cy="12" r="3.5" fill="#3b82f6" />
    <circle class="journey-node-3" cx="75" cy="12" r="4" fill="#38bdf8" />
    <rect x="90" y="0" width="145" height="24" rx="5" fill="#0b1730" stroke="#1e3a5f" stroke-width="1" />
    <text x="162" y="12" text-anchor="middle" dominant-baseline="central" class="mono-meta">PROGRESS TRACK</text>
  </g>
</svg>