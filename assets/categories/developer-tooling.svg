<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 220" width="430" height="220">
  <defs>
    <linearGradient id="catBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1730"/>
      <stop offset="100%" stop-color="#060B18"/>
    </linearGradient>
    <linearGradient id="amberCyan4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B1730" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="428" height="218" rx="12" fill="url(#catBg4)" stroke="#23436B" stroke-width="1.5"/>
  <rect x="1" y="1" width="428" height="218" rx="12" fill="url(#glow4)"/>
  
  <path d="M12 1.5h406c5.8 0 10.5 4.7 10.5 10.5v1.5H1.5V12C1.5 6.2 6.2 1.5 12 1.5z" fill="url(#amberCyan4)"/>
  
  <g transform="translate(20, 26)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#102344" stroke="#23436B"/>
    <path d="M8 8l4 4-4 4m6 0h6" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
    <text x="36" y="14" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="0.5">TOOLING / DEVELOPER TOOLS</text>
    <text x="36" y="26" fill="#B8C7DC" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500">VS Code • Git Branches • Android Termux Environment • Testing QA</text>
  </g>

  <!-- Left: Git Branching Tree -->
  <g transform="translate(20, 68)">
    <rect width="180" height="134" rx="8" fill="#0A1428" stroke="#1E3A5F" stroke-width="1.2"/>
    <rect width="180" height="20" rx="8" fill="#111F3A"/>
    <path d="M0 12h180v8H0z" fill="#111F3A"/>
    <text x="12" y="14" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="9" font-weight="700">GIT BRANCHING &amp; CI/CD</text>
    
    <!-- Branch Diagram -->
    <g transform="translate(20, 36)">
      <!-- Main trunk line -->
      <line x1="20" y1="10" x2="140" y2="10" stroke="#3B82F6" stroke-width="2.5"/>
      <!-- Feature branch curve -->
      <path d="M40 10c15 0 20 25 35 25h35c15 0 20-25 30-25" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="3,2"/>
      <!-- Release branch -->
      <path d="M60 10c15 0 20 48 35 48h25" fill="none" stroke="#F59E0B" stroke-width="2"/>
      
      <!-- Nodes -->
      <circle cx="20" cy="10" r="4.5" fill="#3B82F6"/>
      <circle cx="40" cy="10" r="4.5" fill="#3B82F6"/>
      <circle cx="60" cy="10" r="4.5" fill="#3B82F6"/>
      <circle cx="140" cy="10" r="4.5" fill="#06B6D4"/>
      
      <circle cx="75" cy="35" r="4" fill="#10B981"/>
      <circle cx="110" cy="35" r="4" fill="#10B981"/>
      
      <circle cx="95" cy="58" r="4" fill="#F59E0B"/>
      <circle cx="120" cy="58" r="4" fill="#F59E0B"/>
      
      <text x="145" y="13" fill="#60A5FA" font-family="monospace" font-size="7.5">main</text>
      <text x="145" y="38" fill="#4ADE80" font-family="monospace" font-size="7.5">feature</text>
      <text x="145" y="61" fill="#FBBF24" font-family="monospace" font-size="7.5">v2.0</text>
    </g>
    
    <!-- Commit tag bar -->
    <rect x="12" y="106" width="156" height="18" rx="4" fill="#102344" stroke="#23436B" stroke-width="0.8"/>
    <text x="20" y="118" fill="#4ADE80" font-family="monospace" font-size="7.5">git commit -m "verified"</text>
  </g>

  <!-- Right: Code Editor and Termux Device Card -->
  <g transform="translate(216, 68)">
    <rect width="194" height="134" rx="8" fill="#0A1428" stroke="#1E3A5F" stroke-width="1.2"/>
    <rect width="194" height="20" rx="8" fill="#111F3A"/>
    <path d="M0 12h194v8H0z" fill="#111F3A"/>
    <text x="12" y="14" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="9" font-weight="700">VS CODE &amp; ANDROID TERMUX</text>
    
    <!-- Code Editor Mock -->
    <g transform="translate(10, 28)">
      <rect width="174" height="44" rx="4" fill="#0D1933" stroke="#23436B" stroke-width="0.8"/>
      <text x="8" y="14" fill="#60A5FA" font-family="monospace" font-size="7.5">1  import { engine } from 'core';</text>
      <text x="8" y="24" fill="#F8FAFC" font-family="monospace" font-size="7.5">2  const client = new Engine();</text>
      <text x="8" y="34" fill="#34D399" font-family="monospace" font-size="7.5">3  await client.runOptimization();</text>
    </g>
    
    <!-- Termux Android Reference -->
    <g transform="translate(10, 78)">
      <rect width="174" height="44" rx="4" fill="#102344" stroke="#23436B" stroke-width="0.8"/>
      <rect x="8" y="8" width="28" height="28" rx="4" fill="#050C1A" stroke="#000000" stroke-width="1"/>
      <text x="22" y="26" fill="#06B6D4" font-family="monospace" font-size="12" font-weight="800" text-anchor="middle">&gt;_</text>
      <text x="44" y="20" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">Termux Android CLI</text>
      <text x="44" y="30" fill="#B8C7DC" font-family="system-ui, sans-serif" font-size="7">Linux Toolchain On-Device</text>
    </g>
  </g>
</svg>