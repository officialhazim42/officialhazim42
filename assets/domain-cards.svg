<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="dom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#060b18" />
    </linearGradient>
    <linearGradient id="dom-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.3" />
    </linearGradient>
    <style>
      .dom-h { font-family: system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .dom-p { font-family: system-ui, sans-serif; font-size: 12px; fill: #94a3b8; }
      .dom-tag { font-family: ui-monospace, monospace; font-size: 10px; font-weight: 700; fill: #38bdf8; letter-spacing: 1.5px; }
    </style>
  </defs>

  <!-- Card 1: Browser-Based Utilities -->
  <g transform="translate(0, 0)">
    <rect width="440" height="110" rx="10" fill="url(#dom-bg)" stroke="url(#dom-border)" stroke-width="1.2" />
    <rect x="0" y="8" width="4" height="26" rx="2" fill="#38bdf8" />
    <circle cx="36" cy="32" r="16" fill="#0f2244" stroke="#1e3a5f" stroke-width="1" />
    <!-- Globe/Browser Icon -->
    <circle cx="36" cy="32" r="9" stroke="#38bdf8" stroke-width="1.3" fill="none" />
    <line x1="27" y1="32" x2="45" y2="32" stroke="#38bdf8" stroke-width="1" />
    <ellipse cx="36" cy="32" rx="4.5" ry="9" stroke="#38bdf8" stroke-width="1" fill="none" />
    <text x="62" y="26" class="dom-tag">01 / IN-BROWSER ARCHITECTURE</text>
    <text x="62" y="44" class="dom-h">Client-Side Web Utilities</text>
    <text x="18" y="76" class="dom-p">Zero server uploads. High-performance browser tools utilizing</text>
    <text x="18" y="94" class="dom-p">Web APIs, HTML5 Canvas, and WebAssembly for absolute privacy.</text>
  </g>

  <!-- Card 2: Document and PDF Processing -->
  <g transform="translate(460, 0)">
    <rect width="440" height="110" rx="10" fill="url(#dom-bg)" stroke="url(#dom-border)" stroke-width="1.2" />
    <rect x="0" y="8" width="4" height="26" rx="2" fill="#3b82f6" />
    <circle cx="36" cy="32" r="16" fill="#0f2244" stroke="#1e3a5f" stroke-width="1" />
    <!-- Document Icon -->
    <path d="M 30 23 L 38 23 L 43 28 L 43 41 L 30 41 Z" stroke="#60a5fa" stroke-width="1.3" fill="none" />
    <path d="M 38 23 L 38 28 L 43 28" stroke="#60a5fa" stroke-width="1" fill="none" />
    <line x1="33" y1="33" x2="40" y2="33" stroke="#60a5fa" stroke-width="1" />
    <line x1="33" y1="36" x2="38" y2="36" stroke="#60a5fa" stroke-width="1" />
    <text x="62" y="26" class="dom-tag">02 / DOCUMENT ENGINEERING</text>
    <text x="62" y="44" class="dom-h">Document &amp; PDF Processing</text>
    <text x="18" y="76" class="dom-p">Client-side OCR, merge, split, compress, and conversion suites</text>
    <text x="18" y="94" class="dom-p">using pdf-lib, pdf.js, SheetJS, and Tesseract.js engines.</text>
  </g>

  <!-- Card 3: Image Processing and Optimization -->
  <g transform="translate(0, 130)">
    <rect width="440" height="110" rx="10" fill="url(#dom-bg)" stroke="url(#dom-border)" stroke-width="1.2" />
    <rect x="0" y="8" width="4" height="26" rx="2" fill="#06b6d4" />
    <circle cx="36" cy="32" r="16" fill="#0f2244" stroke="#1e3a5f" stroke-width="1" />
    <!-- Image Icon -->
    <rect x="28" y="24" width="16" height="16" rx="2" stroke="#22d3ee" stroke-width="1.3" fill="none" />
    <circle cx="33" cy="29" r="1.5" fill="#22d3ee" />
    <path d="M 29 37 L 34 32 L 37 35 L 40 31 L 43 35" stroke="#22d3ee" stroke-width="1.2" fill="none" />
    <text x="62" y="26" class="dom-tag">03 / DIGITAL MEDIA</text>
    <text x="62" y="44" class="dom-h">Image Processing &amp; Compression</text>
    <text x="18" y="76" class="dom-p">Modern compression (AVIF, WebP), real-time ratios, smart naming,</text>
    <text x="18" y="94" class="dom-p">theme toggles, and client-side canvas transformations.</text>
  </g>

  <!-- Card 4: Progressive Web Apps -->
  <g transform="translate(460, 130)">
    <rect width="440" height="110" rx="10" fill="url(#dom-bg)" stroke="url(#dom-border)" stroke-width="1.2" />
    <rect x="0" y="8" width="4" height="26" rx="2" fill="#38bdf8" />
    <circle cx="36" cy="32" r="16" fill="#0f2244" stroke="#1e3a5f" stroke-width="1" />
    <!-- Mobile/PWA Icon -->
    <rect x="30" y="23" width="12" height="18" rx="2" stroke="#38bdf8" stroke-width="1.3" fill="none" />
    <circle cx="36" cy="37.5" r="1" fill="#38bdf8" />
    <text x="62" y="26" class="dom-tag">04 / APPLICATION PLATFORMS</text>
    <text x="62" y="44" class="dom-h">Progressive Web Apps (PWAs)</text>
    <text x="18" y="76" class="dom-p">Installable, responsive, offline-first mobile and desktop apps</text>
    <text x="18" y="94" class="dom-p">with Service Workers, caching strategies, and local resilience.</text>
  </g>
</svg>