<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="100%" height="48">
  <defs>
    <linearGradient id="qah-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1329" stop-opacity="0.96" />
      <stop offset="50%" stop-color="#0d1b3a" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#071022" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="qah-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e3a5f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <style>
      @keyframes headerFade {
        0% { opacity: 0; transform: translateY(5px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .qah-root {
        animation: headerFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .qah-badge {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.8px;
        fill: #38bdf8;
      }
      .qah-desc {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 12.5px;
        font-weight: 500;
        fill: #94a3b8;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .qah-root {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <g class="qah-root">
    <rect x="1" y="1" width="898" height="46" rx="8" fill="url(#qah-bg)" stroke="url(#qah-stroke)" stroke-width="1.1" />
    <circle cx="20" cy="24" r="3.5" fill="#38bdf8" />
    <text x="32" y="28" class="qah-badge">QUICK-ACTION PORTFOLIO &amp; CONNECTION BOARD</text>
    <text x="880" y="28" text-anchor="end" class="qah-desc">Instant Access to Verified Developer Channels</text>
  </g>
</svg>