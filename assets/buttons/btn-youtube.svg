<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 206 44" width="206" height="44">
  <defs>
    <linearGradient id="btn-bg-btn-youtube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1730"/>
      <stop offset="100%" stop-color="#102344"/>
    </linearGradient>
    <style>
      @keyframes arrowDrift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      @keyframes borderShimmer {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; stroke: #ff0000; }
      }
      .hero-btn {
        cursor: pointer;
        transform-origin: 103px 22px;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
      }
      .hero-btn .btn-arrow-icon {
        animation: arrowDrift 2.2s ease-in-out infinite;
        transition: transform 0.2s ease;
      }
      .hero-btn .btn-border {
        animation: borderShimmer 3s ease-in-out infinite;
        transition: stroke 0.2s ease, stroke-width 0.2s ease;
      }
      .btn-icon {
        transform-origin: 10px 10px;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
      }
      .hero-btn:hover, svg:hover .hero-btn {
        transform: translateY(-2px) scale(1.025);
        filter: drop-shadow(0 4px 14px rgba(255, 0, 0, 0.4));
      }
      .hero-btn:hover .btn-border, svg:hover .hero-btn .btn-border {
        stroke: #ff0000;
        stroke-width: 1.5;
      }
      .hero-btn:hover .btn-arrow-icon, svg:hover .hero-btn .btn-arrow-icon {
        transform: translateX(4px);
      }
      .hero-btn:hover .btn-icon, svg:hover .hero-btn .btn-icon {
        transform: scale(1.12);
        filter: drop-shadow(0 0 4px #ff0000);
      }
      .hero-btn:active, svg:active .hero-btn {
        transform: translateY(0.5px) scale(0.98);
      }
      .hero-btn:focus {
        outline: 2px solid #ff0000;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .hero-btn, .btn-arrow-icon, .btn-border, .btn-icon {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <g class="hero-btn" tabindex="0" role="button">
    <rect x="0.75" y="0.75" width="204.5" height="42.5" rx="8" class="btn-border" fill="url(#btn-bg-btn-youtube)" stroke="#1E3A5F" stroke-width="1.2"/>
    <g transform="translate(14, 12)">
      <g class="btn-icon">
        <path d="M19.5 5.1c-.2-.7-.7-1.3-1.4-1.5C16.8 3.2 10.5 3.2 10.5 3.2s-6.3 0-7.6.4C2.2 3.8 1.7 4.4 1.5 5.1 1.1 6.4 1.1 9.1 1.1 9.1s0 2.7.4 4c.2.7.7 1.3 1.4 1.5 1.3.4 7.6.4 7.6.4s6.3 0 7.6-.4c.7-.2 1.2-.8 1.4-1.5.4-1.3.4-4 .4-4s0-2.7-.4-4zM8.5 11.6V6.6l4.5 2.5-4.5 2.5z" fill="#FF0000"/>
      </g>
    </g>
    <text x="44" y="18" fill="#ff6b6b" font-family="ui-monospace, monospace" font-size="9" font-weight="700" letter-spacing="1px">YOUTUBE</text>
    <text x="44" y="32" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">@officialhazim42</text>
    <g class="btn-arrow-icon">
      <path d="M192 20l4 4-4 4" stroke="#ff6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
    </g>
  </g>
</svg>