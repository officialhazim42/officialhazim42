<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 34" width="172" height="34">
  <defs>
    <linearGradient id="btn-bg-instagram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e0e26"/>
      <stop offset="100%" stop-color="#421332"/>
    </linearGradient>
    <style>
      @keyframes btnEntrance {
        0% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes arrowDrift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      @keyframes borderShimmer {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; stroke: #e4405f; }
      }
      .btn-root {
        cursor: pointer;
        animation: btnEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transform-origin: 86px 17px;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
      }
      .btn-root .btn-arrow-icon {
        animation: arrowDrift 2s ease-in-out infinite;
        transition: transform 0.2s ease;
      }
      .btn-root .btn-border {
        animation: borderShimmer 2.8s ease-in-out infinite;
        transition: stroke 0.2s ease, stroke-width 0.2s ease;
      }
      .btn-root:hover, svg:hover .btn-root {
        transform: translateY(-2px) scale(1.03);
        filter: drop-shadow(0 4px 14px rgba(228, 64, 95, 0.45));
      }
      .btn-root:hover .btn-border, svg:hover .btn-root .btn-border {
        stroke: #e4405f;
        stroke-width: 1.4;
      }
      .btn-root:hover .btn-arrow-icon, svg:hover .btn-root .btn-arrow-icon {
        transform: translateX(4px);
      }
      .btn-root:active, svg:active .btn-root {
        transform: translateY(0.5px) scale(0.98);
      }
      .btn-root:focus {
        outline: 2px solid #e4405f;
        outline-offset: 2px;
      }
      .btn-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.8px;
        fill: #f472b6;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .btn-root, .btn-arrow-icon, .btn-border {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <g class="btn-root" tabindex="0" role="button">
    <!-- Base Glass Container -->
    <rect x="0.75" y="0.75" width="170.5" height="32.5" rx="7" class="btn-border" fill="url(#btn-bg-instagram)" stroke="rgba(228, 64, 95, 0.5)" stroke-width="1.1"/>
    
    <!-- Platform Mini Icon (16x16 scaled) -->
    <g transform="translate(10, 9) scale(0.666)">
      <defs><linearGradient id="ig-row-g" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFDC80"/><stop offset="50%" stop-color="#F56040"/><stop offset="100%" stop-color="#C13584"/></linearGradient></defs><rect x="2" y="2" width="20" height="20" rx="6" fill="none" stroke="url(#ig-row-g)" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="url(#ig-row-g)" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.2" fill="#FD1D1D"/>
    </g>

    <!-- Action Text -->
    <text x="32" y="21" class="btn-label">OPEN INSTAGRAM</text>

    <!-- Animated Action Indicator Arrow -->
    <g class="btn-arrow-icon">
      <path d="M150 13l4 4-4 4m4-4h-8" stroke="#f472b6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
    </g>
  </g>
</svg>