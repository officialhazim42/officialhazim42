<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 32" width="232" height="32" style="overflow: visible;">
  <defs>
    <linearGradient id="p-bg-id-gh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1730"/>
      <stop offset="100%" stop-color="#102344"/>
    </linearGradient>
    <style>
      svg { overflow: visible; }
      @keyframes btnEntrance {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes arrowDrift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(2.5px); }
      }
      @keyframes borderShimmer {
        0%, 100% { stroke-opacity: 0.55; stroke: #1e3a5f; }
        50% { stroke-opacity: 1; stroke: #38bdf8; }
      }
      .pill-root {
        cursor: pointer;
        animation: btnEntrance 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transform-origin: 116px 16px;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
      }
      .pill-border {
        animation: borderShimmer 3.2s ease-in-out infinite;
        transition: stroke 0.2s ease;
      }
      .pill-arrow {
        animation: arrowDrift 2.4s ease-in-out infinite;
        transition: transform 0.2s ease;
      }
      .pill-icon {
        transform-origin: 10px 10px;
        transition: transform 0.22s ease;
      }
      .pill-root:hover, svg:hover .pill-root {
        transform: translateY(-2px) scale(1.025);
        filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.45));
      }
      .pill-root:hover .pill-border, svg:hover .pill-root .pill-border {
        stroke: #38bdf8;
      }
      .pill-root:hover .pill-arrow, svg:hover .pill-root .pill-arrow {
        transform: translateX(4px);
      }
      .pill-root:hover .pill-icon, svg:hover .pill-root .pill-icon {
        transform: scale(1.12);
        filter: drop-shadow(0 0 4px #38bdf8);
      }
      .pill-root:active, svg:active .pill-root {
        transform: translateY(0.5px) scale(0.98);
      }
      .pill-root:focus {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.5px;
        fill: #e2e8f0;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .pill-root, .pill-arrow, .pill-border, .pill-icon {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <g class="pill-root" tabindex="0" role="button">
    <rect x="0.75" y="0.75" width="230.5" height="30.5" rx="6" class="pill-border" fill="url(#p-bg-id-gh)" stroke="#1e3a5f" stroke-width="1.1"/>
    <!-- GitHub Icon -->
    <g transform="translate(10, 8)" class="pill-icon">
      <path d="M8 1C4.1 1 1 4.1 1 8c0 3.1 2 5.8 4.8 6.7.35.07.48-.15.48-.35v-1.3c-2 .4-2.4-.9-2.4-.9-.35-.8-.8-1-8-1-.65-.4.05-.4.05-.4.7.05 1.1.7 1.1.7.65 1.1 1.7.8 2.1.6.07-.5.28-.8.5-1-1.6-.2-3.3-.8-3.3-3.5 0-.8.3-1.4.7-1.9-.07-.2-.35-.9.07-1.9 0 0 .6-.2 2 .7.6-.17 1.2-.25 1.8-.25s1.2.08 1.8.25c1.4-.9 2-.7 2-.7.42 1 .14 1.7.07 1.9.45.5.7 1.1.7 1.9 0 2.7-1.7 3.3-3.3 3.5.25.2.5.6.5 1.3v2c0 .2.13.42.48.35C13 13.8 15 11.1 15 8c0-3.9-3.1-7-7-7z" fill="#38BDF8"/>
    </g>
    <text x="30" y="19.5" class="pill-text">github.com/officialhazim42</text>
    <!-- Arrow -->
    <g class="pill-arrow">
      <path d="M212 13l3 3-3 3m3-3h-6" stroke="#38bdf8" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
    </g>
  </g>
</svg>
