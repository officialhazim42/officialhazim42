<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 34" width="172" height="34" style="overflow: visible;">
  <defs>
    <linearGradient id="bg-btn-visit-youtube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#340b11"/>
      <stop offset="100%" stop-color="#460f16"/>
    </linearGradient>
    <style>
      svg { overflow: visible; }
      @keyframes btnEntrance {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes arrowDrift {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(3px); }
      }
      @keyframes borderShimmer {
        0%, 100% { stroke-opacity: 0.55; stroke: rgba(255, 0, 0, 0.45); }
        50% { stroke-opacity: 1; stroke: #ff0000; }
      }
      @keyframes iconGaze {
        0%, 100% { filter: drop-shadow(0 0 0px transparent); }
        50% { filter: drop-shadow(0 0 3px rgba(255, 0, 0, 0.7)); }
      }
      .btn-root {
        cursor: pointer;
        animation: btnEntrance 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transform-origin: 86px 17px;
        transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), filter 0.24s ease;
      }
      .btn-root .btn-arrow-icon {
        animation: arrowDrift 2.4s ease-in-out infinite;
        transition: transform 0.2s ease;
      }
      .btn-root .btn-border {
        animation: borderShimmer 3.2s ease-in-out infinite;
        transition: stroke 0.2s ease, stroke-width 0.2s ease;
      }
      .btn-icon {
        transform-origin: 12px 12px;
        animation: iconGaze 3.2s ease-in-out infinite;
        transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), filter 0.22s ease;
      }
      .btn-root:hover, svg:hover .btn-root {
        transform: translateY(-2px) scale(1.028);
        filter: drop-shadow(0 4px 14px rgba(255, 0, 0, 0.45));
      }
      .btn-root:hover .btn-border, svg:hover .btn-root .btn-border {
        stroke: #ff0000;
        stroke-width: 1.4;
      }
      .btn-root:hover .btn-arrow-icon, svg:hover .btn-root .btn-arrow-icon {
        transform: translateX(4.5px);
      }
      .btn-root:hover .btn-icon, svg:hover .btn-root .btn-icon {
        transform: scale(1.12);
        filter: drop-shadow(0 0 5px #ff0000);
      }
      .btn-root:active, svg:active .btn-root {
        transform: translateY(0.5px) scale(0.98);
      }
      .btn-root:focus {
        outline: 2px solid #ff0000;
        outline-offset: 2px;
      }
      .btn-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.8px;
        fill: #ff6b6b;
      }
      @media (prefers-reduced-motion: reduce) {
        *, .btn-root, .btn-arrow-icon, .btn-border, .btn-icon {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>
  <g class="btn-root" tabindex="0" role="button">
    <!-- Base Glass Container -->
    <rect x="0.75" y="0.75" width="170.5" height="32.5" rx="7" class="btn-border" fill="url(#bg-btn-visit-youtube)" stroke="rgba(255, 0, 0, 0.45)" stroke-width="1.1"/>
    
    <!-- Platform Mini Icon -->
    <g transform="translate(10, 9) scale(0.666)">
      <g class="btn-icon">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" fill="#FF0000"/>
      </g>
    </g>

    <!-- Action Text -->
    <text x="32" y="21" class="btn-label">VISIT CHANNEL</text>

    <!-- Animated Action Indicator Arrow -->
    <g class="btn-arrow-icon">
      <path d="M150 13l4 4-4 4m4-4h-8" stroke="#ff6b6b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
    </g>
  </g>
</svg>