    <path d="M -8 -4 L 0 4 L 8 -4" stroke="#06b6d4" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Technology Cards Grid (6 cards across 864px) -->
