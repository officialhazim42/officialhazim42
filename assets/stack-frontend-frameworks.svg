    <text y="20" class="title">WEB MARKUP, STYLING &amp; FRONTEND FRAMEWORKS</text>
    <text y="38" class="sub">Semantic web standards, modern reactive component frameworks, and utility-first styling</text>
  </g>

  <!-- Right Decorative Traces & Dots -->
  <g transform="translate(680, 24)">
    <line x1="0" y1="12" x2="160" y2="12" stroke="#1E3A5F" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="170" cy="12" r="3.5" fill="#06b6d4" />
    <circle cx="185" cy="12" r="2" fill="#38bdf8" />
    <circle cx="198" cy="12" r="1.5" fill="#3b82f6" />
  </g>

